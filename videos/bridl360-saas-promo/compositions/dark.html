  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      gsap.set(".d-img, #d-row1, #d-row2, #d-row3", { opacity: 0 });
      // the confirmation's dark ring floods the screen
      const c = { r: 0 };
      const applyC = () => (document.querySelector("#root").style.clipPath = "circle(" + c.r.toFixed(1) + "px at 960px 540px)");
      applyC();
      tl.to(c, { r: 1150, duration: 0.38, ease: "power2.in", onUpdate: applyC }, 0);
      tl.eventCallback("onUpdate", applyC);
      // find the best [opportunity]
      tl.fromTo(".d-w", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.24, stagger: 0.08, ease: "power3.out" }, 0.4);
      tl.fromTo("#d-row0", { opacity: 0, x: 188, scale: 0.7 }, { opacity: 1, x: 188, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 0.6);

      tl.to("#d-row0", { x: 0, duration: 0.42, ease: "power3.inOut" }, 1.3);
      // Quick / Confident / Easy: three homes, each lands with a fast push
      const cuts = [["#d-q", "#d-row1", 1.65], ["#d-c", "#d-row2", 2.45], ["#d-e", "#d-row3", 3.25]];
      cuts.forEach(([img, row, t], i) => {
        tl.set(img, { opacity: 1 }, t);
        tl.fromTo(img, { scale: 1.26 }, { scale: 1.04, duration: 0.8, ease: "expo.out", immediateRender: false }, t);
        tl.set(i === 0 ? "#d-row0" : cuts[i - 1][1], { opacity: 0 }, t);
        tl.fromTo(row, { opacity: 0, y: 26, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, t + 0.04);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["dark"] = tl;
