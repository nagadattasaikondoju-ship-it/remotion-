    #b-right {

      position: absolute;

    }

  </style>
  <div id="root" data-composition-id="build" data-width="1920" data-height="1080">
    <div id="b-cam" data-layout-allow-overflow>
      <img id="b-plot" class="b-full" src="assets/images/build-plot.jpg" alt="" />
      <div id="b-tiles"></div>
      <img id="b-whole" class="b-full" src="assets/images/build.jpg" alt="Modern glass-front home" />
      <div id="b-right"><img class="b-full" src="assets/images/slide.jpg" alt="Modern home lit at night" /></div>
      <div id="b-handle"><div id="b-grip"></div></div>
    </div>
    <div id="b-label">Home</div>
    <div id="b-blob"></div>
    <div id="b-say"><span class="b-l">Whatever.</span><span class="b-l">Whenever....</span></div>
  </div>
  <script>
    (function () {
      // the home assembles from 84 tiles of its own photo (seeded, so every render is identical)
      let seed = 360;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const COLS = 12, ROWS = 7, W = 1920 / COLS, H = 1080 / ROWS;
      const box = document.querySelector("#b-tiles");
      const tiles = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          const d = document.createElement("div");
          d.className = "b-tile";
          d.style.left = c * W + "px";
          d.style.top = r * H + "px";
          d.style.width = W + 0.6 + "px";
          d.style.height = H + 0.6 + "px";
          d.style.backgroundPosition = -c * W + "px " + -r * H + "px";
          box.appendChild(d);
          const dx = c * W + W / 2 - 960, dy = r * H + H / 2 - 600;
          tiles.push({ el: d, dist: Math.hypot(dx, dy), dx, dy });
        }
      const maxD = Math.max(...tiles.map((t) => t.dist));

      const tl = gsap.timeline({ paused: true });
      gsap.set("#b-whole, #b-label, #b-blob, .b-l", { opacity: 0 });
      gsap.set("#b-right", { clipPath: "inset(0px 0px 0px 1960px)" });
      gsap.set("#b-handle", { x: 1960 });
      tl.fromTo("#b-plot", { scale: 1.07 }, { scale: 1.0, duration: 1.7, ease: "power2.out" }, 0);
      tl.fromTo("#b-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0.62);
      tl.to("#b-label", { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, 1.65);
      tiles.forEach((t) => {
        const k = t.dist / maxD;
        tl.fromTo(
          t.el,
          { x: t.dx * (0.25 + rnd() * 0.5) + (rnd() - 0.5) * 220, y: t.dy * (0.25 + rnd() * 0.5) - 120 - rnd() * 260, rotation: (rnd() - 0.5) * 80, scale: 0.3 + rnd() * 0.4, opacity: 0 },
          { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" },
          0.84 + k * 0.32 + rnd() * 0.08,
        );
      });
      tl.to("#b-whole", { opacity: 1, duration: 0.08 }, 1.62);
      tl.to("#b-tiles", { opacity: 0, duration: 0.01 }, 1.7);

      // the slider sweeps in from the right to the next home
      const s = { x: 1960 };
      const applyX = () => {
        gsap.set("#b-handle", { x: s.x });
        document.querySelector("#b-right").style.clipPath = "inset(0px 0px 0px " + s.x.toFixed(1) + "px)";
      };
      tl.to(s, { x: 460, duration: 1.34, ease: "power2.out", onUpdate: applyX }, 1.63);
      // the camera leans in on the seam: Whatever. Whenever.
      tl.to("#b-cam", { scale: 1.35, transformOrigin: "0px 540px", duration: 0.45, ease: "power2.inOut" }, 3.05);
      tl.to(s, { x: 150, duration: 0.45, ease: "power2.inOut", onUpdate: applyX }, 3.05);
      tl.fromTo("#b-blob", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 3.28);
      tl.fromTo(".b-l", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.12, ease: "power2.out" }, 3.36);
      tl.to("#b-handle", { opacity: 0, duration: 0.01 }, 4.25);
      tl.eventCallback("onUpdate", applyX);
      window.__timelines = window.__timelines || {};
      window.__timelines["build"] = tl;
    })();
  </script>
