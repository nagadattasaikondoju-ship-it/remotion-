  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const DY_START = [8, 0, 12, 4, 20, 0, 6]; // the loose building block
      const DY_KEY = [30, 0, 45, 15, 55, 10, 35]; // pins set to the key's cuts (matches the blade underside)
      const CENTERS = [170, 230, 290, 350, 410, 470, 530];

      // static start states
      gsap.set("#r-white, #r-key", { opacity: 1 });
      gsap.set("#r-caption, #r-sign, #r-black", { opacity: 0 });

      // 0 - 1.0: the building piece rises into place
      tl.fromTo("#r-bit", { y: 150 }, { y: 0, duration: 0.7, ease: "power2.inOut" }, 0.32);
      DY_START.forEach((d, i) => tl.fromTo("#r-s" + i, { y: d }, { y: d, duration: 0.01 }, 0));

      // 0.35 - 1.0: the key tips up and flies out to the right
      tl.fromTo(
        "#r-key",
        { x: -32, y: -112, rotation: -2, transformOrigin: "874px 1043px" },
        { x: 980, y: -230, rotation: -15, duration: 0.65, ease: "power2.in" },
        0.35,
      );
      // 1.0 - 2.9: it slides back in from the right along the pins and comes to rest
      const ENTER_FROM = 1150, T0 = 1.0, DUR = 1.9;
      tl.fromTo("#r-key", { x: ENTER_FROM, y: 0, rotation: 0 }, { x: 0, y: 0, rotation: 0, duration: DUR, ease: "power3.out", immediateRender: false }, T0);
      // each pin drops to its cut as the key's tip (x = 120 + offset) passes over it
      CENTERS.forEach((c, i) => {
        const u = 1 - Math.cbrt((c - 120) / ENTER_FROM); // power3.out inverted: offset = FROM * (1 - u)^3
        const t = T0 + u * DUR;
        tl.fromTo("#r-s" + i, { y: DY_START[i] }, { y: DY_KEY[i], duration: 0.28, ease: "back.out(1.6)", immediateRender: false }, t);
      });

      // 3.2 - 4.35: the pins line up, the white falls away, the building piece becomes the photo
      tl.to(".r-strip", { y: 0, duration: 0.38, ease: "power2.inOut", stagger: 0.025 }, 3.2);
      tl.to("#r-white", { opacity: 0, duration: 1.1, ease: "power1.inOut" }, 3.25);
      tl.to("#r-key", { opacity: 0, duration: 0.85, ease: "power1.inOut" }, 3.5);

      // 4.6: the line
      tl.to("#r-caption", { opacity: 1, duration: 0.45, ease: "power1.out" }, 4.6);
      tl.to("#r-sign", { opacity: 1, duration: 0.45, ease: "power1.out" }, 4.9);

      // 7.2: fade to black
      tl.to("#r-black", { opacity: 1, duration: 0.55, ease: "power1.in" }, 7.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["reel"] = tl;
    })();
  </script>
