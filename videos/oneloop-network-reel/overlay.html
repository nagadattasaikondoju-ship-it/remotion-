<!doctype html>
<html><head><meta charset="utf-8"><title>overlay</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("fonts/Fraunces-VF.ttf"); font-weight: 100 900; }
  @font-face { font-family: "ColorEmoji"; src: url("file:///usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"); }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-700.woff"); font-weight: 700; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-800.woff"); font-weight: 800; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  .shade { position: absolute; left: 0; right: 0; top: 150px; height: 360px;
    background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(0,0,0,.42), rgba(0,0,0,0) 74%); }
  .shade.mid { top: 560px; height: 820px; background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0,0,0,.34), rgba(0,0,0,0) 76%); }
  .head { position: absolute; top: 236px; left: 0; right: 0; text-align: center; color: #fff;
    font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 74px; line-height: 1.04; letter-spacing: -0.5px;
    font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 72;
    text-shadow: 0 2px 12px rgba(0,0,0,.45); -webkit-text-stroke: 2px rgba(0,0,0,.18); paint-order: stroke fill; }

  /* Yellow block: the reference's golden yellow (#FCD400, sampled from the photo) on a 3D plane.
     The plane is turned so its left edge recedes: left letters are smaller and lean, right letters are bigger,
     and the lines fan out to the right. A soft drop shadow separates it from the footage. */
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: var(--persp); perspective-origin: 50% 50%; }
  .plane { position: absolute; left: 0; right: 0; top: var(--top); display: flex; flex-direction: column; align-items: center;
    transform-style: preserve-3d; transform-origin: 50% 50%; }
  .line { white-space: pre; font-family: "Poppins", sans-serif; font-weight: 700; font-size: var(--fs); line-height: var(--lh);
    letter-spacing: var(--ls); color: #FCD400; transform-style: preserve-3d; }
  .line span { display: inline-block; transform-origin: 50% 85%;
    text-shadow: 0 5px 10px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.25), 0 0 22px rgba(0,0,0,.22); }
  .line .b { font-weight: 800; }
  .emoji { font-family: "ColorEmoji", "Noto Color Emoji"; font-size: calc(var(--fs) * 0.82); text-shadow: 0 4px 8px rgba(0,0,0,.25) !important; }
  /* Black ink version (?ink=black): solid #000 letters; separation flips to a soft light glow, and the emoji
     becomes a black silhouette to match the text. */
  body.black .line { color: #000; }
  body.black .line span { text-shadow: 0 0 2px rgba(255,255,255,.55), 0 0 10px rgba(255,255,255,.45), 0 0 24px rgba(255,255,255,.30); }
  body.black .shade.mid { background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,255,255,.22), rgba(255,255,255,0) 76%); }
  body.black .emoji { filter: grayscale(1) contrast(2.6) brightness(.32) drop-shadow(0 0 6px rgba(255,255,255,.6)); text-shadow: none !important; }
</style></head>
<body>
<div class="shade"></div><div class="shade mid"></div>
<div class="head">Your network is your<br>net worth</div>
<div class="stage" id="stage"><div class="plane" id="plane"></div></div>
<script>
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d);
const P = {
  persp: num("persp", 1400),   // px: lower = stronger perspective
  rotY: num("rotY", -14),       // deg: plane turned, right edge toward the camera (lines fan out to the right)
  rotX: num("rotX", 0),       // deg: slight tilt back
  rotZ: num("rotZ", 0),     // deg: roll
  bulge: num("bulge", 30),     // px: the plane bows toward the camera right of centre
  lean: num("lean", 16),       // deg: extra italic lean on the far (left) letters
  fs: num("fs", 78), lh: num("lh", 1.22), ls: num("ls", 1), top: num("top", 620),
  sway: num("sway", 1),        // 0 = still, 1 = gentle looping 3D drift
};
const st = document.getElementById("stage").style;
st.setProperty("--persp", P.persp + "px"); st.setProperty("--fs", P.fs + "px"); st.setProperty("--lh", P.lh); st.setProperty("--ls", P.ls + "px");
document.getElementById("plane").style.setProperty("--top", P.top + "px");

const V = Q.get("v") || "channel";
const INK = Q.get("ink") || "gold";
if (INK === "black") document.body.classList.add("black");
const CTA = V === "comments"
  ? [["Introduce yourself"], ["in the COMMENTS,", ["COMMENTS,"]]]
  : [["Join the CHANNEL", ["CHANNEL"]], ["(link in bio),"]];
const LINES = INK === "black"
  ? [["If you are a Founder/"], ["Entrepreneur"], ["building something"], ["for the future"], ...CTA, ["let’s connect 🤝"]]
  : [["If you are a Founder|"], ["Entrepreneur"], ["building something"], ["for the future"], ...CTA, ["let’s connect 🥂"]];

const plane = document.getElementById("plane");
const letters = [];
LINES.forEach(([text, bold = []], li) => {
  const el = document.createElement("div"); el.className = "line";
  for (const w of text.split(/( )/)) for (const ch of Array.from(w)) {
    const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch;
    if (bold.includes(w)) s.classList.add("b");
    if (/\p{Extended_Pictographic}/u.test(ch)) s.classList.add("emoji");
    el.appendChild(s); letters.push({ el: s, li, u: 0 });
  }
  plane.appendChild(el);
});

// Each letter sits on a gently bowed surface: u is its position across the whole block (-1 left … +1 right).
// The bow (translateZ) peaks right of centre, and far-left letters lean italic, as in the reference.
function layout() {
  const pr = plane.getBoundingClientRect(); let minX = 1e9, maxX = -1e9;
  for (const L of letters) { const r = L.el.getBoundingClientRect(); L.cx = r.left + r.width / 2; minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right); }
  const mid = (minX + maxX) / 2, half = (maxX - minX) / 2;
  for (const L of letters) {
    L.u = (L.cx - mid) / half;
    const z = P.bulge * Math.exp(-((L.u - 0.35) ** 2) / 0.55);
    const lean = -P.lean * Math.min(1, Math.max(0, (-L.u - 0.45) / 0.55)) ** 1.1;  // only the first letter or two of the far-left words lean
    L.el.style.transform = `translateZ(${z.toFixed(1)}px) skewX(${lean.toFixed(2)}deg)`;
  }
}
// Gentle 3D drift: periods of 5 s and 2.5 s, so the 10 s reel loops exactly.
window.seek = (t) => {
  const a = 2 * Math.PI * t / 5, s = P.sway;
  const ry = P.rotY + s * 3.0 * Math.sin(a), rx = P.rotX + s * 1.6 * Math.sin(a + 1.3), rz = P.rotZ + s * 0.6 * Math.sin(2 * a);
  const fy = s * 6 * Math.sin(2 * a + 0.4);
  plane.style.transform = `translateY(${fy.toFixed(2)}px) rotateZ(${rz.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
};
window.ready = document.fonts.ready.then(() => new Promise((r) => requestAnimationFrame(() => { layout(); window.seek(0); requestAnimationFrame(r); })));
</script>
</body></html>
