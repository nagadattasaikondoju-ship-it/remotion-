<!doctype html>
<html><head><meta charset="utf-8"><title>overlay</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("fonts/Fraunces-VF.ttf"); font-weight: 100 900; }
  @font-face { font-family: "ColorEmoji"; src: url("file:///usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"); }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-600.woff"); font-weight: 600; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-700.woff"); font-weight: 700; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-800.woff"); font-weight: 800; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  /* Soft dark bands behind both text blocks, so the yellow reads over bright foliage. */
  .shade { position: absolute; left: 0; right: 0; }
  .shade.top { top: 150px; height: 360px; background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(0,0,0,.42), rgba(0,0,0,0) 74%); }
  .shade.mid { top: 600px; height: 760px; background: radial-gradient(ellipse 62% 50% at 50% 50%, rgba(0,0,0,.44), rgba(0,0,0,0) 76%); }
  .head { position: absolute; top: 236px; left: 0; right: 0; text-align: center; color: #fff;
    font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 74px; line-height: 1.04; letter-spacing: -0.5px;
    font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 72;
    text-shadow: 0 2px 12px rgba(0,0,0,.45); -webkit-text-stroke: 2px rgba(0,0,0,.18); paint-order: stroke fill; }
  .block { position: absolute; top: 690px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .line { white-space: pre; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 72px; line-height: 1.12; color: #FFD21F;
    text-shadow: 0 2px 10px rgba(0,0,0,.42); -webkit-text-stroke: 2.5px rgba(40,25,0,.30); paint-order: stroke fill; }
  .line span { display: inline-block; }
  .line .b { font-weight: 800; }
  .emoji { font-family: "ColorEmoji", "Noto Color Emoji"; font-size: 60px; -webkit-text-stroke: 0; text-shadow: none; }
</style></head>
<body>
<div class="shade top"></div><div class="shade mid"></div>
<div class="head">Your network is your<br>net worth</div>
<div class="block" id="block"></div>
<script>
// Each line sits on a gentle wave (letter by letter), like the reference's wavy caption.
// [text, amplitude px, wavelength px, phase, tilt deg, bold words]
const LINES = [
  ["If you are a Founder |", 7, 520, 0.0, -2.2],
  ["Entrepreneur", 6, 460, 1.4, 1.2],
  ["building something", 8, 560, 2.6, 0.8],
  ["for the future", 6, 480, 0.6, -0.6],
  ["Join the CHANNEL", 8, 540, 2.0, 1.4, ["CHANNEL"]],
  ["(link in bio),", 6, 460, 0.9, -1.0],
  ["let’s connect 🥂", 7, 500, 2.4, 0.6],
];
const block = document.getElementById("block");
for (const [text, amp, wl, ph, tilt, bold = []] of LINES) {
  const el = document.createElement("div"); el.className = "line"; el.style.transform = `rotate(${tilt}deg)`;
  const words = text.split(/( )/);
  for (const w of words) {
    const isBold = bold.includes(w);
    for (const ch of Array.from(w)) {
      const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch;
      if (isBold) s.classList.add("b");
      if (/\p{Extended_Pictographic}/u.test(ch)) s.classList.add("emoji");
      el.appendChild(s);
    }
  }
  block.appendChild(el);
  // place the wave after layout, from each letter's x centre
  requestAnimationFrame(() => {
    const W = el.getBoundingClientRect();
    for (const s of el.children) {
      const r = s.getBoundingClientRect(); const x = r.left + r.width / 2 - W.left;
      const y = amp * Math.sin((2 * Math.PI * x) / wl + ph);
      const slope = (amp * 2 * Math.PI / wl) * Math.cos((2 * Math.PI * x) / wl + ph);
      s.style.transform = `translateY(${y.toFixed(2)}px) rotate(${(Math.atan(slope) * 180 / Math.PI).toFixed(2)}deg)`;
    }
  });
}
window.ready = document.fonts.ready.then(() => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))));
</script>
</body></html>
