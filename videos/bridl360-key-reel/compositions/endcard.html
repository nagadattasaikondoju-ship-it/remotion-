    <div id="e-zoom" data-layout-allow-overflow>
      <!-- the BRIDL360 mark at 0.85 px per unit of the 806px trace; logo bbox x 190..630, y 142..684 -->
      <svg id="e-logo" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="e-soft" x="-20%" y="-20%" width="140%" height="140%">

        <g transform="translate(353 380) scale(0.85) translate(-190 -142)">
          <polygon id="e-door" fill="var(--color-brand, #0047AB)" points="326,361.6 412,407 511,355.7 511,500 326,597.8" />
          <g id="e-shadow" fill="none" stroke="#001a4d" stroke-width="14" stroke-linejoin="miter" stroke-linecap="square" filter="url(#e-soft)" transform="translate(9 12)">
            <polyline points="190,570 190,142 326,212 194,292 412,407 630,294" />

  <script>
    (function () {
      const toFrame = (x, y) => [353 + 0.85 * (x - 190), 380 + 0.85 * (y - 142)];
      const DOOR = [[326, 361.6], [412, 407], [511, 355.7], [511, 500], [326, 597.8]].map((p) => toFrame(p[0], p[1]));
      const Z = toFrame(418.5, 453.5);
      const C = [540, 960];
      const SMAX = 30;
      const zoom = document.querySelector("#e-zoom");
      const plate = document.querySelector("#e-plate");
      const plateImg = document.querySelector("#e-plate img");
      const proxy = { p: 1 };
      function apply(p) {
        const s = Math.pow(SMAX, p);
        const tx = (C[0] - Z[0]) * p, ty = (C[1] - Z[1]) * p;
        gsap.set(zoom, { transformOrigin: Z[0] + "px " + Z[1] + "px", x: tx, y: ty, scale: s });
        const poly = DOOR.map((q) => (Z[0] + tx + s * (q[0] - Z[0])).toFixed(2) + "px " + (Z[1] + ty + s * (q[1] - Z[1])).toFixed(2) + "px");
        plate.style.clipPath = "polygon(" + poly.join(", ") + ")";
        // as we pull back, the city slides so the door ends framing the skyline
        gsap.set(plateImg, { y: -820 * (1 - p) });
      }
      apply(1);

      const tl = gsap.timeline({ paused: true });
      // pull back out of the door: the city shrinks into the BRIDL360 mark
      tl.fromTo(proxy, { p: 1 }, { p: 0, duration: 1.15, ease: "expo.out" }, 0);
      tl.eventCallback("onUpdate", () => apply(proxy.p));
      // the door closes to brand blue, the mark lands
      tl.fromTo("#e-door", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0.85);
      tl.fromTo("#e-plate", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 0.85);
      tl.fromTo("#e-shadow", { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 0.9);
      tl.fromTo("#e-win rect", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.42, stagger: 0.05, ease: "back.out(2)" }, 1.0);
      // wordmark letter by letter, then tagline and URL
      tl.fromTo("#e-word .e-l", { opacity: 0.0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.05, ease: "power2.out" }, 1.1);
      tl.fromTo("#e-tag", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power2.out" }, 1.65);
      tl.fromTo("#e-url", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 1.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["endcard"] = tl;
    })();
  </script>
