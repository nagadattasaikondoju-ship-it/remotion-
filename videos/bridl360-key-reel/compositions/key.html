  <script>
    (function () {
      // logo space (806px trace) -> key svg space -> frame px
      const KX = 90, KY = 760, KS = 0.9;
      const toFrame = (x, y) => [KX + KS * (600 + (x - 190) * 0.78), KY + KS * (40 + (y - 142) * 0.78)];
      const DOOR = [[326, 361.6], [412, 407], [511, 355.7], [511, 500], [326, 597.8]].map((p) => toFrame(p[0], p[1]));
      const Z = toFrame(418.5, 453.5); // middle of the door
      const C = [540, 960];
      const SMAX = 42;
      const zoom = document.querySelector("#k-zoom");
      const plate = document.querySelector("#k-plate");
      const plateImg = document.querySelector("#k-plate img");
      const proxy = { p: 0 };
      function apply(p) {
        const s = Math.pow(SMAX, p);
        const tx = (C[0] - Z[0]) * p, ty = (C[1] - Z[1]) * p;
        gsap.set(zoom, { transformOrigin: Z[0] + "px " + Z[1] + "px", x: tx, y: ty, scale: s });
        const poly = DOOR.map((q) => (Z[0] + tx + s * (q[0] - Z[0])).toFixed(2) + "px " + (Z[1] + ty + s * (q[1] - Z[1])).toFixed(2) + "px");
        plate.style.clipPath = "polygon(" + poly.join(", ") + ")";
        // at rest the door frames the sunset skyline; it slides to the full-frame position as we fly in
        gsap.set(plateImg, { transformOrigin: "540px 960px", scale: 1.12, y: -470 * (1 - p) });
      }
      apply(0);

      const tl = gsap.timeline({ paused: true });
      // key glides in and settles
      tl.fromTo("#k-glide", { x: 110, rotation: -7, transformOrigin: "780px 1010px" }, { x: 0, rotation: 0, duration: 1.0, ease: "expo.out" }, 0);
      // the skyline bit rises and locks into the blade
      tl.fromTo("#k-bit", { x: -34, y: 190, rotation: 7, svgOrigin: "330 320" }, { x: 0, y: 0, rotation: 0, duration: 0.82, ease: "power4.out" }, 0.3);
      // lock impact: a 6px knock along the blade
      tl.fromTo("#k-svg", { x: 0 }, { x: 7, duration: 0.06, ease: "power2.out" }, 1.12);
      tl.to("#k-svg", { x: 0, duration: 0.24, ease: "power3.out" }, 1.18);
      // the door in the logo opens onto the city
      tl.fromTo("#k-door", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 1.3);
      // type leaves before the fly-through
      tl.fromTo(
        "#k-head .k-w, #k-eyebrow .k-w",
        { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.05, ease: "power2.in" },
        1.46,
      );
      // fly through the door
      tl.fromTo(proxy, { p: 0 }, { p: 1, duration: 0.86, ease: "power2.in" }, 1.7);
      tl.eventCallback("onUpdate", () => apply(proxy.p));
      window.__timelines = window.__timelines || {};
      window.__timelines["key"] = tl;
    })();
  </script>
