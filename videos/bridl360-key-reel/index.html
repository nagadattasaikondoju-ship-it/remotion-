<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-brand","type":"color","label":"BRIDL360 blue","default":"#0047AB"},
    {"id":"color-ivory","type":"color","label":"Ivory","default":"#F5EFE4"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#14213D"},
    {"id":"color-sun","type":"color","label":"Sunset accent","default":"#F4B26A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-brand: #0047ab;
        --color-ivory: #f5efe4;
        --color-ink: #14213d;
        --color-sun: #f4b26a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1426;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1426;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Scene 1: the key assembles from the Hyderabad skyline, then we fly through the logo's door -->
      <div
        id="key"
        data-composition-id="key"
        data-composition-src="compositions/key.html"
        data-start="0"
        data-duration="2.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <!-- Scene 2: the city, editorial type from the Portfolio Series carousel -->
      <div
        id="city"
        data-composition-id="city"
        data-composition-src="compositions/city.html"
        data-start="2.7"
        data-duration="6.55"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <!-- Scene 3: zoom back out of the door into the BRIDL360 mark -->
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="9.25"
        data-duration="4.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <audio id="bgm" class="clip" src="assets/audio/bed.wav" data-start="0" data-duration="14" data-track-index="10" data-volume="1.3"></audio>
      <audio id="sfx-whoosh-a" class="clip" src="assets/audio/whoosh-in.wav" data-start="0.02" data-duration="0.6" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-lock" class="clip" src="assets/audio/key-lock.wav" data-start="1.08" data-duration="0.45" data-track-index="11" data-volume="0.9"></audio>
      <audio id="sfx-riser" class="clip" src="assets/audio/riser.wav" data-start="1.72" data-duration="1.0" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-impact" class="clip" src="assets/audio/impact.wav" data-start="2.72" data-duration="0.9" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-tick-1" class="clip" src="assets/audio/tick.wav" data-start="6.43" data-duration="0.12" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-tick-2" class="clip" src="assets/audio/tick.wav" data-start="6.88" data-duration="0.12" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-tick-3" class="clip" src="assets/audio/tick.wav" data-start="7.33" data-duration="0.12" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-b" class="clip" src="assets/audio/whoosh-out.wav" data-start="9.22" data-duration="0.7" data-track-index="11" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
