<script>
/* ======================= maths ======================= */
const W = 1080, H = 1920, COP = "#E59C69", CRM = "#E1E0CC", DT = 1 / 240;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const ei = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x - 10) - 0.001) / 0.999);
const eio = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// closed-form damped spring (ζ = 0.8 → ~1.5 % overshoot), settles (1 %) at d seconds after t0

const show = (el, on) => { el.style.visibility = on ? "visible" : "hidden"; };

/* ======================= HOOK (0 – 2 s) ======================= */
const HOOK = { lines: ["GROWTH", "BREAKS", "IN THE", "GAPS"], split: [3, 3, 3, 2], y: [600, 800, 1000, 1200], t: [-0.1, 0.25, 0.5, 0.75], delay: [0.05, 0.0, 0.03, 0.0] };

  const s1 = sp(t, 1.0, 0.3), imp = kick(t, 1.0);

    const all = [...L.halves[0].letters, ...L.halves[1].letters], n = all.length;

    const dl = HOOK.delay[li], p = P(t, 1.25 + dl, 1.5 + dl), off = 1300 * p * p * p, v = 1300 * 3 * p * p / 0.25;
    const dy = li === 3 ? imp * 14 : imp * 5 * (li - 1.5) / 1.5;

const ROWS = ["unit economics", "ad waste", "conversion leakages", "team friction"];

  const tx = mk("div", "", s, row, "color:rgba(225,224,204,.45)"); return { row, ic, ck: ic.querySelector(".ck"), tx }; });
const STA = [ // growth path stations (node world positions) and their cards
  { n: [860, 1700], side: "L", num: "02", key: "Build", rest: " &amp; Deploy", tag: "Engineering", body: "sub-second loads, and verified tracking." },
  { n: [220, 2300], side: "R", num: "03", key: "Market", rest: " &amp; Track", tag: "9x ROAS", body: "Full-funnel Google Search, Shopping, and Meta campaigns." },
  { n: [860, 2900], side: "L", num: "04", key: "Automate", rest: " Operations", tag: "Zero Waste", body: "automated lead routing, and self-correcting AI." },
  { n: [220, 3500], side: "R", num: "05", key: "Scale", rest: " &amp; Expand", tag: "Compounding", body: "Ongoing month-over-month optimization." },
];

  const w = 600, h = 330, x = s.side === "L" ? 100 : 380, y = s.n[1] - h / 2;
  const c = mk("div", "a card", null, $("pcards"), `left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
  const num = mk("span", "r num", s.num, mk("div", "a m", null, c, "left:44px;top:40px;height:34px"));
  const ttl = mk("span", "r ttl", `<span class="k">${s.key}</span>${s.rest}`, mk("div", "a m", null, c, "left:44px;top:86px;height:68px"), "font-size:54px;line-height:68px");
  const tag = mk("span", "r tag", s.tag, mk("div", "a m", null, c, "left:44px;top:164px;height:48px"), "font-size:22px;line-height:42px;padding:0 18px");

});

const PATHD = "M902 678 C990 678 1015 720 1015 820 L1015 1400 C1015 1560 860 1560 860 1700 C860 2000 220 2000 220 2300 C220 2600 860 2600 860 2900 C860 3200 220 3200 220 3500 C220 3700 540 3700 540 3900";
$("ptrail").setAttribute("d", PATHD);
const PATHN = 2400, PPTS = [], PCUM = [];
{ const pe = $("ptrail"), L = pe.getTotalLength(); for (let i = 0; i <= PATHN; i++) { const q = pe.getPointAtLength((L * i) / PATHN); PPTS.push([q.x, q.y]); } let c = 0; PCUM.push(0); for (let i = 1; i <= PATHN; i++) { c += Math.hypot(PPTS[i][0] - PPTS[i - 1][0], PPTS[i][1] - PPTS[i - 1][1]); PCUM.push(c); } }
