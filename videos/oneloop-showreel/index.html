<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>One Loop — One Stroke</title>
<style>
  @font-face { font-family: "M"; src: url("fonts/Montserrat-VF.ttf"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="logo.js"></script>
<script>
/* One Loop — "One stroke, never lifted".
   Every pixel is a pure function of t: window.seek(t) draws the frame, nothing animates on its own and no state
   survives between calls. 120 BPM → beat 0.5 s, bar 2 s, 15 s = 7.5 bars. */
// ?v=1 → 1080×1920 vertical (Reels). Same timeline; layouts adapt below wherever the frame shape matters.
const V = new URLSearchParams(location.search).get("v") === "1";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, CX = W / 2, CY = H / 2, DUR = 15;
document.getElementById("c").width = W; document.getElementById("c").height = H;
const FITW = W - 100;          // widest a hero element may be
const K12 = V ? 0.64 : 1;      // bars 1–2 (mark + slit type) scale so the mark and AUTOMATE fit the width
const KM = V ? 1.15 : 1;       // bar 3 icons get bigger in the tall frame (the 3D bar inherits it)
const COP = "#E59C69", TER = "#8F432E", CRM = "#F7E8DA", BLK = "#000000", WHT = "#FFFFFF";
const RGB = { cop: [229, 156, 105], ter: [143, 67, 46], crm: [247, 232, 218] };

/* ---------- time helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eIn = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eIO = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// critically damped spring (no overshoot, no bounce): 0 → 1 after t0, stiffness w
const spring = (t, t0, w = 18) => { const d = t - t0; return d <= 0 ? 0 : 1 - (1 + w * d) * Math.exp(-w * d); };
const B = (n) => n * 0.5; // beat n → seconds

/* ---------- deterministic PRNG ---------- */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- polylines ---------- */
function cum(pts) { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return c; }

  for (let i = 0; i < n; i++) { const s = (L * i) / (n - 1); while (j < c.length - 2 && c[j + 1] < s) j++;
    const u = (s - c[j]) / (c[j + 1] - c[j] || 1); out.push([lerp(pts[j][0], pts[j + 1][0], u), lerp(pts[j][1], pts[j + 1][1], u)]); }

}
function strokePart(ctx, pts, c, s0, s1) { // draw arc-length fraction s0..s1 of a polyline
  const L = c[c.length - 1], a = s0 * L, b = s1 * L; if (b - a < 1e-6) return;

    const p1 = [lerp(pts[i][0], pts[i + 1][0], u1), lerp(pts[i][1], pts[i + 1][1], u1)];

}
function strokePts(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke(); }

/* ---------- the One Loop mark — vectorised from the real logo (logo.js) ----------

const RL = LOGO.meta.rl, SW = LOGO.meta.sw;   // loop centre-line radius and stroke width, measured from the logo
const TH = Math.asin(2 * RL);                  // angle at which a line through the X meets each loop tangentially
const XL = 0.2076, XH = 0.0369, XLW = 0.0316;  // the logo's outlined X: arm half-length, half-thickness, outline width
function fig8Raw() { // the mark as ONE continuous line (the loops, joined through the X by tangent diagonals)

  seg([0, 0], T, 40); arc(-0.5, a0, a0 + span, 280); seg([T[0], -T[1]], [0, 0], 40);

const N = 480;
const FIG8 = resample(fig8Raw(), N);
const FIG8C = cum(FIG8);
const DL = 0.5 * Math.cos(TH), AL = (Math.PI + 2 * TH) * RL, TL = 4 * DL + 2 * AL;
const FR = [0, DL / TL, (DL + AL) / TL, (2 * DL + AL) / TL, (3 * DL + AL) / TL, (3 * DL + 2 * AL) / TL, 1];
const MARK_W = 1 + 2 * (RL + SW / 2); // outer width of the mark in units

function pathOf(ctx, polys, S) { ctx.beginPath(); for (const poly of polys) { poly.forEach(([x, y], i) => (i ? ctx.lineTo(x * S, y * S) : ctx.moveTo(x * S, y * S))); ctx.closePath(); } }
// the two loops exactly as drawn in the logo (cut ends included); out = [dx, dy, scale] about each loop centre
function drawLoops(ctx, S, outL = [0, 0, 1], outR = [0, 0, 1]) {
  ctx.fillStyle = COP;
  for (const [g, o, cx] of [[LOGO.CL, outL, -0.5], [LOGO.CR, outR, 0.5]]) {
    ctx.save(); ctx.translate((o[0] + cx) * S, o[1] * S); ctx.scale(o[2], o[2]); ctx.translate(-cx * S, 0);
    pathOf(ctx, g, S); ctx.fill("evenodd"); ctx.restore();

}
// the logo's X exactly (traced), spun/scaled about its centre
function drawXLogo(ctx, S, scale, rot) {
  if (scale <= 0.001) return;
  ctx.save(); ctx.rotate(rot); ctx.scale(scale, scale); pathOf(ctx, LOGO.X, S); ctx.fillStyle = COP; ctx.fill("evenodd"); ctx.restore();
}
// parametric twin of the X (same proportions) for the moves the artwork can't do: arms stretching / collapsing
function xPoly(Lh, Lv, h) {
  return [[h, h], [h, Lv], [-h, Lv], [-h, h], [-Lh, h], [-Lh, -h], [-h, -h], [-h, -Lv], [h, -Lv], [h, -h], [Lh, -h], [Lh, h]];
}
function drawX(ctx, S, scale, rot, Lh = XL, Lv = XL, lw = XLW) {
  if (scale <= 0.001) return;
  const pts = xPoly(Lh, Lv, XH);
  ctx.save(); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * S, y * S) : ctx.moveTo(x * S, y * S))); ctx.closePath();
  ctx.lineWidth = (lw * S) / scale; ctx.strokeStyle = COP; ctx.lineJoin = "miter"; ctx.stroke(); ctx.restore();
}
function drawMark(ctx, S) { drawLoops(ctx, S); drawXLogo(ctx, S, 1, 0); }
// the snap that turns the continuous figure-eight into the logo: diagonals retract into the crossing, X spins in
function diagonals(ctx, S, r, lw) {
  if (r >= 1) return;
  const pts = FIG8.map(([x, y]) => [x * S, y * S]), cc = FIG8C.map((v) => v * S);
  ctx.strokeStyle = COP; ctx.lineWidth = lw; ctx.lineCap = "butt";
  strokePart(ctx, pts, cc, 0, FR[1] * (1 - r)); strokePart(ctx, pts, cc, FR[2] + (FR[3] - FR[2]) * r, FR[3]);
  strokePart(ctx, pts, cc, FR[3], FR[3] + (FR[4] - FR[3]) * (1 - r)); strokePart(ctx, pts, cc, FR[5] + (FR[6] - FR[5]) * r, 1);
}
function markSnap(ctx, S, t, t0) {
  drawLoops(ctx, S); diagonals(ctx, S, eOut(P(t, t0, t0 + 0.3)), SW * S);
  const snap = spring(t, t0, 16); drawXLogo(ctx, S, snap, (Math.PI / 2) * (1 - snap));

/* ---------- type ---------- */
const F = (w, s) => `${w} ${s}px M`;
function glyphs(ctx, str, size, weight, track) { // per-letter advance with tracking (em)
  ctx.font = F(weight, size); const out = []; let x = 0;
  for (const ch of str) { const w = ctx.measureText(ch).width; out.push({ ch, x, w }); x += w + track * size; }
  return { g: out, width: x - track * size };
}
const CAP = 0.70; // Montserrat cap height / em

/* ---------- 3D camera ---------- */
const FOC = 1800, DIST = 1800;
function cam(rx, ry, rz) {

  return (p) => { // roll (z) → tilt (x) → yaw (y)
    let x = p[0] * cz - p[1] * sz, y = p[0] * sz + p[1] * cz, z = p[2];
    let y2 = y * cx - z * sx, z2 = y * sx + z * cx; y = y2; z = z2;

}
function proj(q, ortho, ox = 0, oy = 0) { const k = lerp(FOC / (q[2] + DIST), 1, ortho); return [CX + ox + q[0] * k, CY + oy + q[1] * k, k]; }
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const shade = (rgb, l) => `rgb(${Math.round(rgb[0] * l)},${Math.round(rgb[1] * l)},${Math.round(rgb[2] * l)})`;

/* solid ribbon along a closed 3D centreline: in-plane width w, extrusion depth d (world z).

    { k: "zb", pts: (i) => [corner(i, 1, 1), corner(i + 1, 1, 1), corner(i + 1, -1, 1), corner(i, -1, 1)], nrm: () => [0, 0, 1], col: RGB.cop },
    { k: "wo", pts: (i) => [corner(i, 1, -1), corner(i + 1, 1, -1), corner(i + 1, 1, 1), corner(i, 1, 1)], nrm: (i) => Nn[i], col: RGB.ter },
    { k: "wi", pts: (i) => [corner(i, -1, -1), corner(i + 1, -1, -1), corner(i + 1, -1, 1), corner(i, -1, 1)], nrm: (i) => [-Nn[i][0], -Nn[i][1], 0], col: RGB.ter },

      const wp = f.pts(i).map(R), cn = R(f.nrm(i));

const to3 = (pts, S, z = 0) => pts.map(([x, y]) => [x * S, y * S, z]);

/* ---------- shape library for the morph bar (pixels, centred) ---------- */
function circlePts(r, m, a0 = Math.PI / 4) { const p = []; for (let i = 0; i <= m; i++) { const a = a0 + (2 * Math.PI * i) / m; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; }
function magPts(handle) { const r = 137, a = Math.PI / 4, rp = [r * Math.cos(a), r * Math.sin(a)];
  const he = [rp[0] + Math.cos(a) * handle, rp[1] + Math.sin(a) * handle]; return [he, ...circlePts(r, 200, a)]; }
function browserPts() { const L = -270, R = 270, T = -190, Bt = 190, D = -110;
  const pts = []; const seg = (a, b, m) => { for (let i = 0; i < m; i++) pts.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); };
  seg([L, D], [R, D], 40); seg([R, D], [R, Bt], 40); seg([R, Bt], [L, Bt], 40); seg([L, Bt], [L, T], 40); seg([L, T], [R, T], 40); seg([R, T], [R, D], 20); pts.push([R, D]); return pts; }
function arrowPts() { const pts = [[-280, 150], [-95, -15], [30, 70], [255, -150], [140, -150], [255, -150], [255, -35]];
  const out = []; for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 30; k++) out.push([lerp(pts[i][0], pts[i + 1][0], k / 30), lerp(pts[i][1], pts[i + 1][1], k / 30)]); out.push(pts[pts.length - 1]); return out; }

const mix2 = (A, Bp, u) => A.map((p, i) => [lerp(p[0], Bp[i][0], u), lerp(p[1], Bp[i][1], u)]);

/* ---------- globe ---------- */
const GR = V ? 380 : 300;
const DOTS = (() => { const out = [], n = 1500, ga = Math.PI * (3 - Math.sqrt(5)); for (let i = 0; i < n; i++) { const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), th = ga * i; out.push([Math.cos(th) * r, y, Math.sin(th) * r]); } return out; })();
const ll = (lat, lon) => { const a = (lat * Math.PI) / 180, b = (lon * Math.PI) / 180; return [Math.cos(a) * Math.sin(b), -Math.sin(a), Math.cos(a) * Math.cos(b)]; };
const CITIES = [
  { n: "HYDERABAD", p: ll(17.39, 78.49) }, { n: "BENGALURU", p: ll(12.97, 77.59) }, { n: "AUSTRALIA", p: ll(-33.33, 115.64) },
  { n: "NEW ZEALAND", p: ll(-40.9, 174.9) }, { n: "UK", p: ll(52.5, -1.9) },

const WAYPT = ll(12, -105); // keeps the NZ → UK leg travelling east, so the whole route is one eastward loop
function slerp(a, b, u) { const dt = clamp(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1), om = Math.acos(dt); if (om < 1e-4) return a;

// the route HYD → BLR → AU → NZ → UK → HYD as one closed loop, lifted above the surface on long hops
const ROUTE = (() => { const stops = [0, 1, 2, 3, -1, 4, 0].map((k) => (k < 0 ? WAYPT : CITIES[k].p)), pts = [], legs = [];

const ROUTE_N = (() => { // resampled to N for the morph into the ribbon

  // route drawing: legs on beats 21-24
  const pts = ROUTE.pts, head = routeHead(t);
  ctx.strokeStyle = COP; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); let pen = false;
  for (let i = 0; i <= Math.floor(head) && i < pts.length; i++) {
    const q = globeXf(pts[i], g); const vis = q[2] < 30; const p = proj(q, 0);
    if (vis) { if (!pen) { ctx.moveTo(p[0], p[1]); pen = true; } else ctx.lineTo(p[0], p[1]); } else pen = false;
  }
  if (head < pts.length) { const i = Math.floor(head), f = head - i, a = globeXf(pts[i], g), b = globeXf(pts[(i + 1) % pts.length], g);
    const q = [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)]; if (q[2] < 30 && pen) { const p = proj(q, 0); ctx.lineTo(p[0], p[1]); } }
  ctx.stroke();
  // city pins pop as the line arrives (on the beat)
  const arrive = [10.0, 10.14, 10.5, 11.0, 11.5];
  CITIES.forEach((c, k) => {
    const q = globeXf(c.p, g); if (q[2] > 10) return; const p = proj(q, 0);
    const s = spring(t, arrive[k], 24); if (s < 0.01) return;
    ctx.fillStyle = COP; ctx.beginPath(); ctx.arc(p[0], p[1], 10 * s, 0, 7); ctx.fill();
    ctx.strokeStyle = COP; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p[0], p[1], 22 * s, 0, 7); ctx.stroke();
  });
  const names = [["HYDERABAD", 10.0], ["AUSTRALIA", 10.5], ["NEW ZEALAND", 11.0], ["UK", 11.5]];
  names.forEach(([nm, t0], i) => {
    let prog = eOut(P(t, t0 + 0.02, t0 + 0.22));
    const t1 = i < 3 ? names[i + 1][1] : 12.0;
    if (t >= t1 - 0.06) prog = 1 + eIn(P(t, t1 - 0.06, t1 + 0.06));
    maskedText(ctx, nm, CX, CY + GR + 96, 40, 700, 0.3, WHT, prog, 1, "center");
  });
}

// BAR 7 — strongest: the route tears off the globe into a giant 3D infinity with the promise racing around it
const PROMISE = "AUDIT. BUILD. MARKET. AUTOMATE. ";
function finale(ctx, t) {
  const a = (x) => (x * Math.PI) / 180;
  const m = spring(t, 12.0, 17);
  const lock = eIO(P(t, 13.5, 13.7));
  const S = lerp(lerp(660, 800, eOut(P(t, 12.5, 12.9))) * lerp(1, 1.08, eOut(P(t, 13.0, 13.4))), 742, lock);
  let rx = lerp(26, 18, eIO(P(t, 12.5, 12.95))), ry = lerp(-38, 30, eIO(P(t, 12.4, 12.95))), rz = 0;
  ry = lerp(ry, -18, eIO(P(t, 13.0, 13.45))); rz = lerp(0, -9, eIO(P(t, 13.0, 13.45))); rx = lerp(rx, 10, eIO(P(t, 13.0, 13.45)));
  rx = lerp(rx, 0, lock); ry = lerp(ry, 0, lock); rz = lerp(rz, 0, lock);
  // route (globe frame at t=12) → figure-eight
  const g = globeRot(12.0);
  const src = ROUTE_N.map((v) => globeXf(v, g));
  const target = to3(FIG8, S, 0);
  // align the route start with the figure-eight start for a clean morph
  const C = target.map((p, i) => { const q = src[i]; return [lerp(q[0], p[0], m), lerp(q[1], p[1], m), lerp(q[2], p[2], m)]; });
  const R = cam(a(rx * m), a(ry * m), a(rz));
  // final lock: ribbon becomes the flat logo stroke, then the X snaps in (same move as the hook)
  const wv = lerp(7, 112, eOut(P(t, 12.12, 12.42))), w = lerp(wv, SW * S, lock);
  const d = lerp(0, 64, eOut(P(t, 12.16, 12.46))) * (1 - lock);
  const speed = 520 + 900 * eIO(P(t, 12.95, 13.2)) - 900 * eIO(P(t, 13.3, 13.5));
  const offset = 300 * (t - 12) + speed * Math.max(0, t - 12.95) * 0.9;
  const txtIn = eOut(P(t, 12.16, 12.42)), txtOut = P(t, 13.4, 13.56);
  const ks = lerp(1, Math.min(1, FITW / (S * MARK_W)), m);
  ctx.save(); ctx.translate(CX, CY); ctx.scale(ks, ks); ctx.translate(-CX, -CY);
  if (t < 13.7) {
    ribbon(ctx, C, w, d, { rot: R, ortho: 0, text: { str: PROMISE, size: 66, offset, lobes: [[0, N / 2, false], [N / 2, N, true]],
      hide: (p) => Math.hypot(p[0], p[1]) < 0.13 * S * m,
      scales: (r, gl) => clamp(txtIn * 1.15) * (1 - eIn(clamp(txtOut * 1.5 - (gl.x / 1400) * 0.5))) } });
  } else { ctx.save(); ctx.translate(CX, CY); markSnap(ctx, S, t, 13.7); ctx.restore(); }
  ctx.restore();
}
const S_LOCK = 742 * Math.min(1, FITW / (742 * MARK_W)); // on-screen size of the mark when the finale locks

// END — the real One Loop lockup assembles (traced artwork), then collapses into the opening dot
function ending(ctx, t) {
  const M = LOGO.meta, S13 = S_LOCK, SE = Math.min(550, (W - (V ? 200 : 120)) / (M.right - M.left));
  const rise = eIO(P(t, 13.85, 14.05));
  const col = eIn(P(t, 14.62, 14.96)); // collapse into the seed dot
  const drift = 1 + 0.035 * P(t, 13.95, 14.62);
  const lockC = (M.top + M.tagBot) / 2; // vertical centre of the full lockup, in units below the X
  const Sm = lerp(S13, SE, rise) * drift, my = CY - lockC * Sm * rise;
  if (col < 0.995) {
    ctx.save(); ctx.translate(CX, CY); ctx.scale(1 - col, 1 - col); ctx.translate(-CX, -CY);
    ctx.save(); ctx.translate(CX, my); markSnap(ctx, Sm, t, 13.7); ctx.restore();
    // wordmark: each letter rises through a mask, centre-out
    const wTop = my + M.wordTop * Sm, wBot = my + M.wordBot * Sm, wh = wBot - wTop;
    ctx.save(); ctx.beginPath(); ctx.rect(0, wTop - 3, W, wh + 6); ctx.clip(); ctx.fillStyle = WHT;
    LOGO.WORD.forEach((L, i) => { const o = Math.abs(i - 3), up = (1 - eOut(P(t, 13.95 + 0.03 * o, 14.17 + 0.03 * o))) * wh * 1.15;
      if (up >= wh * 1.1) return; ctx.save(); ctx.translate(CX, my + up); pathOf(ctx, L.paths, Sm); ctx.fill("evenodd"); ctx.restore(); });
    ctx.restore();
    // tagline wipes open from the centre
    const wipe = eOut(P(t, 14.02, 14.26)), half = ((M.right - M.left) / 2) * Sm + 20;
    if (wipe > 0) { ctx.save(); ctx.beginPath(); ctx.rect(CX - half * wipe, my + M.tagTop * Sm - 6, 2 * half * wipe, (M.tagBot - M.tagTop) * Sm + 12); ctx.clip();
      ctx.translate(CX, my); pathOf(ctx, LOGO.TAGW, Sm); ctx.fillStyle = WHT; ctx.fill("evenodd"); pathOf(ctx, LOGO.TAGC, Sm); ctx.fillStyle = COP; ctx.fill(); ctx.restore(); }
    ctx.restore();
  }
  // the seed dot — identical to frame 0
  const sd = eOut(P(t, 14.86, 14.95)); if (sd > 0) { ctx.fillStyle = COP; ctx.beginPath(); ctx.arc(CX, CY, 10 * sd, 0, 7); ctx.fill(); }
}

/* ---------- frame ---------- */
function scene(ctx, t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BLK; ctx.fillRect(0, 0, W, H);
  if (t < 2.0) hook(ctx, t);
  else if (t < 4.0) kinetic(ctx, t);
  else if (t < 6.0) morph(ctx, t);
  else if (t < 8.0) three(ctx, t);
  else if (t < 10.0) dash(ctx, t);
  else if (t < 12.0) globe(ctx, t);
  else if (t < 13.85) { if (t < 12.24) globe(ctx, t); finale(ctx, t); }
  else ending(ctx, t);
}
const main = document.getElementById("c"), mctx = main.getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H; const bctx = buf.getContext("2d");
// motion blur inside one sub-frame: average K trailing samples (blur follows speed & direction automatically)
window.seek = (t, K = 4, span = 1 / 180) => {
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalAlpha = 1;
  for (let k = 0; k < K; k++) {
    const ts = t - (span * (K - 1 - k)) / K;
    scene(bctx, Math.max(0, ts));
    mctx.globalAlpha = 1 / (k + 1); mctx.drawImage(buf, 0, 0);
  }
  mctx.globalAlpha = 1;
};
window.ready = (async () => { for (const w of [300, 600, 700, 800, 900]) await document.fonts.load(`${w} 100px M`); window.seek(0); return true; })();
</script>
