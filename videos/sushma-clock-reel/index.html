<!doctype html>
<html><head><meta charset="utf-8"><title>Dr. Sri Sushma: tooth clock</title>
<style>
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-600.woff"); font-weight: 600; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-700.woff"); font-weight: 700; }
  @font-face { font-family: "Poppins"; src: url("fonts/Poppins-800.woff"); font-weight: 800; }
  @font-face { font-family: "Anton"; src: url("fonts/Anton-400.woff"); font-weight: 400; }
  /* Palette from Dr. Sri Sushma's logo: deep blue #257BC6 → light blue #5AB4FF; navy for text. */
  :root { --deep: #257BC6; --light: #5AB4FF; --navy: #0E4C8A; --ink: #16202B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
  #bg { position: absolute; inset: 0; }
  #stage { position: absolute; inset: 0; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .label { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 50px; color: var(--navy); white-space: nowrap;
    text-shadow: 0 0 10px #fff, 0 0 4px #fff; transform-origin: 50% 50%; }
  #card { position: absolute; inset: 0; }
  .center { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  .banner { font-family: "Anton", sans-serif; font-size: 37px; letter-spacing: 0.6px; color: var(--navy); background: #fff;
    border: 3px solid var(--deep); border-radius: 44px; padding: 10px 30px 12px; box-shadow: 0 6px 18px rgba(37,123,198,.18); white-space: nowrap; }
  .tag { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 72px; line-height: 1.08; color: var(--navy); text-align: center; white-space: pre; }
  .tag .cur { display: inline-block; width: 5px; height: 62px; background: var(--deep); margin-left: 6px; vertical-align: -6px; }
  .btn { display: flex; align-items: center; gap: 18px; font-family: "Poppins", sans-serif; font-weight: 700; font-size: 31px; color: #fff;
    background: linear-gradient(90deg, #1E6DB4, var(--deep) 40%, var(--light)); border-radius: 60px; padding: 18px 40px 18px 20px;
    box-shadow: 0 10px 24px rgba(37,123,198,.35), inset 0 2px 0 rgba(255,255,255,.35); position: relative; overflow: hidden; white-space: nowrap; }
  .btn .play { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
  .btn .shine { position: absolute; top: 0; bottom: 0; width: 120px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); transform: skewX(-20deg); }
  .doc { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 48px; color: var(--deep); text-align: center; }
  .role { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 33px; color: var(--ink); text-align: center; }
  .row { display: flex; align-items: center; gap: 18px; font-family: "Poppins", sans-serif; color: var(--ink); white-space: nowrap; }
  .ico { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, var(--deep), var(--light)); display: flex; align-items: center; justify-content: center; flex: none;
    box-shadow: 0 4px 10px rgba(37,123,198,.3); }
  .phone { font-weight: 700; font-size: 50px; letter-spacing: .5px; }
  .web { font-weight: 600; font-size: 36px; }
  .addr { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.38; color: var(--ink); text-align: center; }
  .follow { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 22px; color: #4A5868; text-align: center; letter-spacing: .3px; }
  .soc { display: flex; gap: 22px; justify-content: center; }
  .soc > div { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,.15); }
</style></head>
<body>
<svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8FD6"/><stop offset=".17" stop-color="#BFDDF6"/><stop offset=".34" stop-color="#F3F9FE"/>
      <stop offset=".5" stop-color="#FFFFFF"/><stop offset=".68" stop-color="#F3F9FE"/><stop offset=".85" stop-color="#BFDDF6"/><stop offset="1" stop-color="#3D8FD6"/>
    </linearGradient>
    <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".1" stop-color="#fff" stop-opacity=".96"/><stop offset=".86" stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
    <radialGradient id="cardGlow" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  <rect id="bgCard" width="1080" height="1920" fill="url(#cardFade)" opacity="0"/>
</svg>
<div id="stage">
  <svg id="clock" class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="overflow:visible">
    <defs>
      <radialGradient id="enamel" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F6EFE3"/><stop offset="1" stop-color="#D9C7AC"/></radialGradient>
      <radialGradient id="enamelY" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FBF3DF"/><stop offset=".55" stop-color="#E8D3A6"/><stop offset="1" stop-color="#B8925A"/></radialGradient>
      <radialGradient id="enamelB" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#E9CF95"/><stop offset=".6" stop-color="#B98A4A"/><stop offset="1" stop-color="#6E4A22"/></radialGradient>
      <linearGradient id="rootG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A5E2A"/><stop offset=".5" stop-color="#D2AE6A"/><stop offset="1" stop-color="#7A5124"/></linearGradient>
      <linearGradient id="gum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B2B8"/><stop offset=".45" stop-color="#EC97A1"/><stop offset="1" stop-color="#CF6E7B"/></linearGradient>
      <linearGradient id="gumSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
      <radialGradient id="decay" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#1E120A"/><stop offset=".6" stop-color="#3B2414"/><stop offset="1" stop-color="#6B4422" stop-opacity="0"/></radialGradient>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F6973"/><stop offset=".45" stop-color="#C9D1D8"/><stop offset=".6" stop-color="#E8EDF1"/><stop offset="1" stop-color="#6B757F"/></linearGradient>
      <linearGradient id="handG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB4FF"/><stop offset="1" stop-color="#1F6FB8"/></linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0E2A44" flood-opacity=".22"/></filter>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#5AB4FF" flood-opacity=".95"/></filter>
    </defs>
    <g id="teeth"></g>
    <g id="hands"></g>
    <g id="labels"></g>
  </svg>
  <img id="logo" class="abs" alt="">
  <div id="card"></div>
</div>
<script>
/* ---------------- helpers ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeInOut = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const backOut = (x, s = 1.70158) => (x = clamp(x), 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2));
const spring = (x) => { x = clamp(x); return 1 - Math.exp(-6.5 * x) * Math.cos(10.5 * x); };   // ~1 overshoot, settles
const prog = (t, a, d) => clamp((t - a) / d);
const NS = "http://www.w3.org/2000/svg";

/* ---------------- teeth (drawn, 200 x 240 local box, crown top y≈10, gum y 108–232) ---------------- */
const CROWN = "M50,112 C40,78 36,44 50,24 C60,10 77,11 87,22 C93,15 107,15 113,22 C123,11 140,10 150,24 C164,44 160,78 150,112 Z";
const BROKEN = "M50,112 C42,84 40,62 46,46 L58,52 L64,36 L76,50 L86,40 L96,58 L108,44 L116,56 L128,40 L138,52 L150,44 C160,64 158,86 150,112 Z";
const gum = (scoop) => scoop
  ? `<path d="M14,118 Q14,104 30,104 L66,104 C74,104 76,150 100,152 C124,150 126,104 134,104 L170,104 Q186,104 186,118 L183,190 Q181,206 162,206 L38,206 Q19,206 17,190 Z" fill="url(#gum)"/>
     <path d="M66,104 C74,104 76,150 100,152 C124,150 126,104 134,104" fill="none" stroke="#B4505E" stroke-width="5" opacity=".55"/>
     <path d="M30,104 L66,104 M134,104 L170,104" stroke="#FBD3D6" stroke-width="5" stroke-linecap="round"/>`
  : `<path d="M14,118 Q14,104 30,104 L170,104 Q186,104 186,118 L183,190 Q181,206 162,206 L38,206 Q19,206 17,190 Z" fill="url(#gum)"/>
     <path d="M30,106 Q100,96 170,106" fill="none" stroke="#FBD3D6" stroke-width="6" stroke-linecap="round"/>`;
const gumShade = `<path d="M14,118 Q14,104 30,104 L170,104 Q186,104 186,118 L183,190 Q181,206 162,206 L38,206 Q19,206 17,190 Z" fill="url(#gumSide)"/>`;
const shine = `<path d="M62,34 C58,48 58,64 62,80" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none" opacity=".75"/>`;
const crown = (fill = "url(#enamel)", d = CROWN) => `<path d="${d}" fill="${fill}" stroke="#C9B396" stroke-width="2"/>`;
const TEETH = [
  // 0: 12 o'clock, healthy
  () => crown() + shine + gum() + gumShade,
  // 1: small spot (Ignored)
  () => crown() + shine + `<ellipse cx="121" cy="44" rx="13" ry="11" fill="#8A5A2B" opacity=".35"/><ellipse cx="121" cy="44" rx="7" ry="6" fill="#2A170C"/>` + gum() + gumShade,
  // 2: cavity (Decayed)
  () => crown() + shine + `<ellipse cx="112" cy="50" rx="30" ry="24" fill="url(#decay)"/><path d="M96,42 C102,32 120,30 128,40 C134,50 126,64 112,64 C98,64 92,54 96,42 Z" fill="#24150B"/>` + gum() + gumShade,
  // 3: deep decay reaching the pulp (Treatable)
  () => crown("url(#enamelY)") + shine + `<path d="M74,28 C86,22 120,22 130,32 C140,46 132,70 122,88 C114,100 90,100 82,86 C70,66 64,40 74,28 Z" fill="url(#decay)"/>
        <path d="M82,32 C94,26 116,26 124,36 C130,48 122,66 114,80 C108,90 94,90 88,80 C78,62 74,42 82,32 Z" fill="#22140A"/>
        <path d="M96,70 C100,62 108,62 110,72 L108,104 L98,104 Z" fill="#7A1E14" opacity=".9"/>` + gum() + gumShade,
  // 4: broken, stained (Delayed)
  () => crown("url(#enamelB)", BROKEN) + `<path d="M58,56 L66,44 L76,56 L86,46 L96,62 L106,50 L116,60 L126,46 L138,58 C146,74 140,92 128,100 C110,108 88,108 72,100 C58,90 54,72 58,56 Z" fill="url(#decay)"/>
        <path d="M70,62 L80,56 L92,68 L104,58 L120,66 C128,78 120,92 106,96 C92,98 76,92 70,80 Z" fill="#1E120A"/>` + gum() + gumShade,
  // 5: roots only (Hopeless)
  () => `<path d="M62,112 C58,90 60,68 70,58 C78,52 88,58 90,70 L92,112 Z" fill="url(#rootG)" stroke="#5E3D18" stroke-width="2"/>
        <path d="M108,112 L110,72 C112,58 124,52 132,60 C142,70 142,92 138,112 Z" fill="url(#rootG)" stroke="#5E3D18" stroke-width="2"/>
        <ellipse cx="78" cy="64" rx="10" ry="7" fill="#2A170C"/><ellipse cx="124" cy="66" rx="10" ry="7" fill="#2A170C"/>
        <path d="M70,74 L74,100 M128,78 L126,102" stroke="#F1D9A2" stroke-width="4" opacity=".6" stroke-linecap="round"/>` + gum() + gumShade,
  // 6: empty socket (Lost it)
  () => gum(true) + gumShade,
  // 7: implant (Choose Health)
  () => `<rect x="86" y="96" width="28" height="22" rx="4" fill="url(#metal)"/>` + gum() +
        `<path d="M74,118 L126,118 L123,184 C121,195 111,200 100,200 C89,200 79,195 77,184 Z" fill="url(#metal)" stroke="#4B545D" stroke-width="2"/>` +
        [128,142,156,170,184].map((y) => `<path d="M${75 + (y - 118) * 0.04},${y} L${125 - (y - 118) * 0.04},${y + 6}" stroke="#4B545D" stroke-width="3.5" stroke-linecap="round"/>`).join("") +
        `<path d="M58,98 C50,74 50,48 62,32 C70,22 84,24 92,32 C96,28 104,28 108,32 C116,24 130,22 138,32 C150,48 150,74 142,98 Q100,108 58,98 Z" fill="url(#enamel)" stroke="#C9B396" stroke-width="2"/>
         <path d="M70,46 C67,58 67,70 70,82" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".75"/>` + gumShade,
];

/* ---------------- layout ---------------- */
const CX = 540, CY = 1010, R = 405, TS = 0.98;               // clock centre, ring radius, tooth scale
const pos = (deg, r = R) => [CX + r * Math.sin(deg * Math.PI / 180), CY - r * Math.cos(deg * Math.PI / 180)];
const teethG = document.getElementById("teeth");
const toothEls = TEETH.map((draw, i) => {
  const g = document.createElementNS(NS, "g"); let svg = draw();
  const cut = svg.indexOf('<path d="M14,118'); const top = svg.slice(0, cut), rest = svg.slice(cut);
  g.innerHTML = `<g filter="url(#soft)"><g transform="translate(100,112) scale(1.24) translate(-100,-112)">${top}</g>${rest}</g>`;
  teethG.appendChild(g); return g;
});
const handsG = document.getElementById("hands");
handsG.innerHTML = `
  <g filter="url(#soft)">
    <rect id="hFix" x="${CX - 6}" y="${CY - 250}" width="12" height="262" rx="6" fill="url(#handG)"/>
    <g id="hSweep"><rect x="${CX - 5}" y="${CY - 300}" width="10" height="330" rx="5" fill="#1F6FB8"/></g>
    <circle cx="${CX}" cy="${CY}" r="19" fill="#1F6FB8"/><circle cx="${CX}" cy="${CY}" r="7" fill="#fff"/>
  </g>`;
const LPOS = [[716, 912], [706, 1138], [566, 1258], [400, 1160], [536, 1188], [340, 948], [322, 866]];   // clear of teeth and hands
const LABELS = ["Ignored", "Decayed", "Treatable", "Delayed", "Hopeless", "Lost it", "Choose Health"];
const labelsG = document.getElementById("labels");
const labelEls = LABELS.map((txt) => { const g = document.createElementNS(NS, "g"); labelsG.appendChild(g);
  const w = txt.length * 25 + 52;
  g.innerHTML = `<rect x="${-w / 2}" y="-34" width="${w}" height="68" rx="34" fill="#fff" stroke="#257BC6" stroke-width="3.5" filter="url(#soft)"/>
    <text text-anchor="middle" dominant-baseline="central" y="2" font-family="Poppins" font-weight="700" font-size="44" fill="#0E4C8A">${txt}</text>`;
  return g; });

/* ---------------- end card ---------------- */
const card = document.getElementById("card");
const icon = {
  phone: `<svg width="32" height="32" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`,
  web: `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg>`,
  pin: `<svg width="30" height="34" viewBox="0 0 24 28"><path fill="#fff" d="M12 1a9 9 0 0 0-9 9c0 6.8 9 17 9 17s9-10.2 9-17a9 9 0 0 0-9-9zm0 12.4A3.4 3.4 0 1 1 12 6.6a3.4 3.4 0 0 1 0 6.8z"/></svg>`,
  play: `<svg width="22" height="22" viewBox="0 0 24 24"><path fill="#257BC6" d="M7 4.5v15l12-7.5z"/></svg>`,
};
card.innerHTML = `
  <div class="center" id="cBanner" style="top:506px"><div class="banner">Dr. SRI SUSHMA MULTISPECIALITY DENTAL CLINIC</div></div>
  <div class="center" style="top:604px"><div class="tag" id="cTag"></div></div>
  <div class="center" id="cBtn" style="top:792px"><div class="btn"><div class="play">${icon.play}</div>BOOK AN APPOINTMENT WITH US<div class="shine" id="cShine"></div></div></div>
  <div class="center" id="cDoc" style="top:914px"><div class="doc">Dr. Sri Sushma, MDS</div></div>
  <div class="center" id="cRole" style="top:975px"><div class="role">Periodontist and Implantologist</div></div>
  <div class="center" id="cPhone" style="top:1040px"><div class="row"><div class="ico">${icon.phone}</div><div class="phone">+91 79958 15454</div></div></div>
  <div class="center" id="cWeb" style="top:1120px"><div class="row"><div class="ico">${icon.web}</div><div class="web">drsrisushmadentalclinic.com</div></div></div>
  <div class="center" id="cPinI" style="top:1200px"><div class="ico">${icon.pin}</div></div>
  <div class="center" id="cAddr" style="top:1268px"><div class="addr">Sanjay Apartment, beside Canara Bank,<br>Anandbagh, Moula Ali, Hyderabad,<br>Secunderabad, Telangana 500047</div></div>
  <div class="center" id="cFollow" style="top:1408px"><div class="follow">Follow us on social media</div></div>
  <div class="center" id="cSoc" style="top:1444px"><div class="soc">
    <div id="s1" style="background:#1877F2"><svg width="30" height="38" viewBox="0 0 16 24"><path fill="#fff" d="M10.4 24V13.1h3.6l.6-4.3h-4.2V6.1c0-1.2.4-2.1 2.1-2.1H15V.2C14.6.1 13.3 0 11.8 0 8.6 0 6.4 2 6.4 5.6v3.2H2.8v4.3h3.6V24z"/></svg></div>
    <div id="s2" style="background:linear-gradient(45deg,#F9CE34,#EE2A7B 50%,#6228D7)"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="#fff" stroke="none"/></svg></div>
    <div id="s3" style="background:#25D366"><svg width="38" height="38" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></div>
  </div></div>`;
const $ = (id) => document.getElementById(id);
const TAG = "Act Early…\nChoose Wisely!";

/* ---------------- logo: white background → alpha, cropped to the badge ---------------- */
const logo = $("logo"); let LW = 1, LH = 1;
async function prepLogo() {
  const img = new Image(); img.src = window.LOGO_DATA; await img.decode();
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; const x = c.getContext("2d");
  x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (let i = 0; i < p.length; i += 4) {           // "colour to alpha" with white (keeps the soft shadows as translucent grey)
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const a = Math.max(255 - r, 255 - g, 255 - b) / 255;
    if (a < 0.035) { p[i + 3] = 0; continue; }
    p[i] = Math.round((r - 255 * (1 - a)) / a); p[i + 1] = Math.round((g - 255 * (1 - a)) / a); p[i + 2] = Math.round((b - 255 * (1 - a)) / a);
    p[i + 3] = Math.round(a * 255);
    if (a > 0.25) { const k = i / 4, X = k % c.width, Y = (k / c.width) | 0; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); }
  }
  x.putImageData(d, 0, 0);
  const m = 14, cw = x1 - x0 + 2 * m, ch = y1 - y0 + 2 * m, c2 = document.createElement("canvas"); c2.width = cw; c2.height = ch;
  c2.getContext("2d").drawImage(c, x0 - m, y0 - m, cw, ch, 0, 0, cw, ch);
  logo.src = c2.toDataURL("image/png"); await logo.decode(); LW = cw; LH = ch;
}

/* ---------------- timeline ---------------- */
const DUR = 18.73;                                           // = one loop of the reference song
const ARR = [0.80, 2.17, 3.60, 5.27, 6.80, 8.30, 9.97, 11.33];  // hand arrives at 45° … 360°: the reference's own step times, on the music
const MOVE = 0.42;                                           // seconds each step takes
function sweepAngle(t) {
  let a = 0;
  for (let k = 0; k < ARR.length; k++) { const p = prog(t, ARR[k] - MOVE, MOVE); if (p <= 0) break; a = 45 * k + 45 * backOut(p, 2.2); }
  return a;
}
function place(el, x, y, s = 1, o = 1, extra = "") { el.style.transform = `translate(${x}px,${y}px) scale(${s}) ${extra}`; el.style.opacity = o; }

window.seek = (t) => {
  // card phase: 0 = clock, 1 = end card. In at 12.15–13.0, back out at 20.35–21.0 (so 21.0 == 0.0 for the loop).
  const cin = easeInOut(prog(t, 11.5, 0.8)), cout = easeInOut(prog(t, 18.13, 0.6));
  const C = cin * (1 - cout);
  $("bgCard").setAttribute("opacity", C.toFixed(3));

  // clock: teeth, hands, labels
  const clock = $("clock"); const cs = lerp(1, 0.9, C);
  clock.style.transformOrigin = `${CX}px ${CY}px`; clock.style.transform = `scale(${cs})`; clock.style.opacity = (1 - C).toFixed(3);
  clock.style.filter = C > 0.01 ? `blur(${(C * 10).toFixed(2)}px)` : "none";
  const ang = sweepAngle(t) % 360;
  $("hSweep").setAttribute("transform", `rotate(${ang.toFixed(2)} ${CX} ${CY})`);
  toothEls.forEach((g, i) => {
    const deg = i * 45, [x, y] = pos(deg);
    // the tooth the hand has just reached gives a little bounce and a blue glow
    const k = i === 0 ? 7 : i - 1, hit = prog(t, ARR[k], 0.55), live = t >= ARR[k] && t < (ARR[k + 1] ?? 11.7) - MOVE;
    const bump = hit > 0 && hit < 1 ? Math.sin(hit * Math.PI) * 0.13 * (1 - hit * 0.4) : 0;
    const s = TS * (1 + bump + (live ? 0.04 : 0));
    g.setAttribute("transform", `translate(${x - 100 * s},${y - 120 * s}) scale(${s})`);
    g.firstChild.setAttribute("filter", live ? "url(#glow)" : "url(#soft)");
  });
  labelEls.forEach((el, i) => {
    const a = ARR[i], b = ARR[i + 1] - MOVE, inP = prog(t, a, 0.32), outP = prog(t, b - 0.05, 0.22);
    const o = clamp(inP * 1.4) * (1 - outP), s = 0.55 + 0.45 * spring(inP);
    const [x, y] = LPOS[i];
    el.setAttribute("opacity", o.toFixed(3));
    el.setAttribute("transform", `translate(${x},${y}) scale(${s.toFixed(3)})`);
  });

  // logo: small above the clock → large at the top of the end card
  const wSmall = 250, wBig = 350, w = lerp(wSmall, wBig, C), h = w * LH / LW;
  const cy = lerp(258, 300, C), breathe = 1 + 0.012 * Math.sin(2 * Math.PI * t / (DUR / 5));   // 5 cycles per loop
  place(logo, 540 - w / 2, cy - h / 2, 1, 1); logo.style.width = w + "px"; logo.style.height = h + "px";
  logo.style.transformOrigin = "50% 50%"; logo.style.transform += ` scale(${breathe})`;

  // end card pieces (each fades with the card on the way out)
  const vis = (start, dur = 0.42) => prog(t, start, dur) * (1 - cout);
  const pop = (id, start, dy = 26) => { const p = vis(start); const el = $(id); el.style.opacity = clamp(p * 1.6).toFixed(3);
    el.style.transform = `translateY(${((1 - easeOut(p)) * dy).toFixed(1)}px) scale(${(0.86 + 0.14 * spring(p)).toFixed(3)})`; };
  pop("cBanner", 12.2);
  // typewriter: "Act Early…" 13.3–13.95, "Choose Wisely!" 14.1–14.95
  const n1 = 11, n2 = 14, tp = (t < 13.35) ? Math.round(clamp((t - 12.6) / 0.6) * n1) : n1 + 1 + Math.round(clamp((t - 13.35) / 0.8) * n2);
  const shown = TAG.slice(0, Math.max(0, tp)); const blink = (t < 14.8) && (Math.floor(t * 3.2) % 2 === 0) && t > 12.55;
  $("cTag").innerHTML = shown.replace(/&/g, "&amp;").replace(/\n/g, "<br>") + (blink ? '<span class="cur"></span>' : '<span class="cur" style="opacity:0"></span>');
  $("cTag").style.opacity = (1 - cout).toFixed(3);
  pop("cBtn", 14.3, 0);
  pop("cDoc", 14.62); pop("cRole", 14.78); pop("cPhone", 15.0); pop("cWeb", 15.2); pop("cPinI", 15.4); pop("cAddr", 15.52); pop("cFollow", 15.82);
  pop("cSoc", 15.9, 0);
  ["s1", "s2", "s3"].forEach((id, i) => { const p = vis(15.9 + i * 0.12, 0.4); $(id).style.transform = `scale(${(0.4 + 0.6 * spring(p)).toFixed(3)})`; });
  // a light sweep across the button now and then
  const sh = [15.1, 16.6, 17.5].map((s0) => prog(t, s0, 0.7)).find((p) => p > 0 && p < 1);
  $("cShine").style.left = sh ? `${-160 + sh * 900}px` : "-300px";
};
window.ready = (async () => { await document.fonts.ready; await prepLogo(); window.seek(0); })();
</script>
