<!doctype html>
<html><head><meta charset="utf-8">
<!-- "The Ice Cream Betrayal": a flat 2D explainer on tooth sensitivity for Dr. Sri Sushma Multispeciality Dental Clinic.
     Pure function of time: seek(t) draws the frame at t seconds (0 .. TEND). Beats are tied to the narration's word times
     (timeline.js, from build_vo.py), so the picture follows the voice. 1080x1920, rendered at 60 fps by render.cjs.
     Scenes: Riya + kulfi (hook, the zap) / three habits / dive into the tooth / cross-section: enamel, hard brushing, thin enamel,
     gum recession, exposed root, tubules, cold reaching the nerve, "a door in winter" / the clinic finds the cause /
     the fix: sealed + soft brush / kulfi is back. End card is endcard/ (the clinic's own card). -->

@font-face { font-family: P; font-weight: 600; src: url(fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: P; font-weight: 700; src: url(fonts/Poppins-Bold.ttf); }
@font-face { font-family: P; font-weight: 800; src: url(fonts/Poppins-ExtraBold.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
canvas { display: block; }
</style></head>
