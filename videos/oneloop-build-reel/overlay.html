<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="img/logo.js"></script>
<script>
// Captions + motion graphics for the BUILD reel. Every frame is a pure function of t (window.seek), no timers, no state.
// Timing comes from out/timeline.json (window.TIMELINE), so a re-cut moves everything with it.
const TLD = window.TIMELINE, W = 1080, H = 1920;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COP = "#E59C69", CREAM = "#F7E8DA", RED = "#FF4D4F", GREEN = "#3DDC97", INK = "#0E0F12";
const SEG = {}; TLD.segments.forEach(s => SEG[s.id] = s);
const S = id => SEG[id].start, E = id => SEG[id].start + SEG[id].dur;
// source-time → output-time for the takes that carry motion graphics
const T1 = x => S("frz") + 0.60 + (x - 1.85), T2 = x => S("t2a") + (x - 0.60), T3 = x => S("t3") + (x - 0.55);
const T7 = x => S("t7a") + (x - 0.45), T8 = x => S("t8") + (x - 0.75), T9 = x => S("t9") + (x - 0.70);
const PIP = { x: 250, y: 1590, r: 196 };

const cl = (u, a = 0, b = 1) => Math.min(b, Math.max(a, u));
const P = (t, a, b) => cl((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3), eIn = u => u * u * u, eIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const back = u => { const c = 1.5; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); }; // small overshoot only
const lerp = (a, b, u) => a + (b - a) * u;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const IMG = {};
// images arrive as data URLs (window.IMGDATA, set by render.mjs) so the canvas stays exportable
["nirvaha_s1", "nirvaha_s2", "nirvaha_icon", "lnsports_t"].forEach(n => { const i = new Image(); i.src = (window.IMGDATA || {})[n] || `img/${n}.png`; IMG[n] = i; });
const fonts = [["P", "fonts/Poppins-600.woff", "600"], ["P", "fonts/Poppins-700.woff", "700"], ["P", "fonts/Poppins-800.woff", "800"],
  ["IS", "fonts/InstrumentSerif-Regular.ttf", "400"], ["ISI", "fonts/InstrumentSerif-Italic.ttf", "400"]];
window.ready = Promise.all([...fonts.map(([f, u, w]) => new FontFace(f, `url(${u})`, { weight: w }).load().then(ff => document.fonts.add(ff))),
  ...Object.values(IMG).map(i => i.decode().catch(() => 0))]);

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(w, s, f = "P") { ctx.font = `${w} ${s}px ${f}`; }
function txt(s, x, y, { size = 60, weight = 800, fam = "P", color = "#fff", align = "center", alpha = 1, shadow = 0, stroke = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; font(weight, size, fam); ctx.textAlign = align; ctx.textBaseline = "middle";
  if (shadow) { ctx.shadowColor = `rgba(0,0,0,${shadow})`; ctx.shadowBlur = 22; ctx.shadowOffsetY = 4; }
  if (stroke) { ctx.lineJoin = "round"; ctx.lineWidth = stroke; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function chip(label, x, y, { bg = "rgba(255,255,255,.12)", fg = "#fff", size = 30, dot = null, alpha = 1, pad = 22 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; font(700, size); const w = ctx.measureText(label).width + pad * 2 + (dot ? 26 : 0), h = size * 1.75;
  rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  if (dot) { ctx.beginPath(); ctx.arc(x - w / 2 + pad + 8, y, 8, 0, 7); ctx.fillStyle = dot; ctx.fill(); }
  ctx.fillStyle = fg; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, x - w / 2 + pad + (dot ? 26 : 0), y + 1); ctx.restore();
}
function check(x, y, r, u, color = GREEN) { // a tick that draws itself
  if (u <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(x, y, r * back(cl(u * 1.6)), 0, 7); ctx.fillStyle = color; ctx.fill();
  const k = eOut(P(u, 0.25, 1)); ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.22; ctx.lineCap = ctx.lineJoin = "round";
  const pts = [[-0.42, 0.02], [-0.12, 0.32], [0.45, -0.3]]; ctx.beginPath(); ctx.moveTo(x + pts[0][0] * r, y + pts[0][1] * r);
  if (k < 0.4) { const v = k / 0.4; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], v) * r, y + lerp(pts[0][1], pts[1][1], v) * r); }
  else { const v = (k - 0.4) / 0.6; ctx.lineTo(x + pts[1][0] * r, y + pts[1][1] * r); ctx.lineTo(x + lerp(pts[1][0], pts[2][0], v) * r, y + lerp(pts[1][1], pts[2][1], v) * r); }
  ctx.stroke(); ctx.restore();
}
function cross(x, y, r, u, color = RED) {
  if (u <= 0) return; ctx.save(); ctx.beginPath(); ctx.arc(x, y, r * back(cl(u * 1.6)), 0, 7); ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.22; ctx.lineCap = "round"; const k = eOut(P(u, 0.2, 1)) * 0.36 * r;
  ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke(); ctx.restore();
}
function pipHole(u) { // cut the picture-in-picture circle out of a full-screen panel, then ring it in copper
  ctx.save(); ctx.globalCompositeOperation = "destination-out"; ctx.beginPath(); ctx.arc(PIP.x, PIP.y, PIP.r, 0, 7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha = u; ctx.beginPath(); ctx.arc(PIP.x, PIP.y, PIP.r + 5, 0, 7); ctx.lineWidth = 8; ctx.strokeStyle = COP; ctx.stroke(); ctx.restore();
}
function vignette(color, a) { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.72);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, color.replace("A", a)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function logo(cx, cy, width, { word = true, tag = true, alpha = 1 } = {}) { // the traced One Loop logo (logo.js)
  const M = LOGO.meta, S0 = width / (M.right - M.left); ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(cx, cy);
  const path = polys => { ctx.beginPath(); for (const poly of polys) { poly.forEach(([x, y], i) => i ? ctx.lineTo(x * S0, y * S0) : ctx.moveTo(x * S0, y * S0)); ctx.closePath(); } };
  ctx.fillStyle = COP; path(LOGO.CL); ctx.fill("evenodd"); path(LOGO.CR); ctx.fill("evenodd"); path(LOGO.X); ctx.fill("evenodd");
  if (word) { ctx.fillStyle = "#fff"; for (const L of LOGO.WORD) { path(L.paths); ctx.fill("evenodd"); } }
  if (tag) { ctx.fillStyle = "#fff"; path(LOGO.TAGW); ctx.fill("evenodd"); ctx.fillStyle = COP; path(LOGO.TAGC); ctx.fill(); }
  ctx.restore();
}
function toast(label, u, y = 330) { // red error toast that pops in
  if (u <= 0) return; const k = back(cl(u / 0.28)); ctx.save(); ctx.translate(W / 2, y); ctx.scale(lerp(0.75, 1, k), lerp(0.75, 1, k)); ctx.globalAlpha = cl(u / 0.12);
  font(700, 40); const w = ctx.measureText(label).width + 130; rr(-w / 2, -42, w, 84, 42); ctx.fillStyle = "#E5484D";
  ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8; ctx.fill(); ctx.shadowColor = "transparent";
  cross(-w / 2 + 50, 0, 20, 1, "#fff"); ctx.strokeStyle = "#E5484D"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-w / 2 + 43, -7); ctx.lineTo(-w / 2 + 57, 7); ctx.moveTo(-w / 2 + 57, -7); ctx.lineTo(-w / 2 + 43, 7); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, -w / 2 + 88, 2); ctx.restore();
}

// ---------- captions (rail): white Poppins 800, word by word, the punch word in copper ----------
const CAP = { co1: { y: 1500 }, k0: { y: 1520 }, k1: { y: 1520 }, k2: { y: 1520 }, k3: { y: 1520 }, k4a: { y: 1540 }, k4b: { y: 1540 }, k5a: { y: 1540 }, k5b: { y: 1540 },
  frz: { y: 1540 }, t1b: { y: 1470 }, t1c: { y: 1770, size: 74 }, t2b: { y: 1600 }, t2c: { y: 1610 }, t2d: { x: 700, y: 1600, maxW: 640, size: 68 },
  t3: { y: 1470 }, t4a: { y: 1470 }, t4b: { x: 700, y: 1600, maxW: 640, size: 68 }, t5: { x: 700, y: 1600, maxW: 640, size: 68 }, t6: { x: 700, y: 1600, maxW: 640, size: 68 },
  t7a: { y: 1470 }, t9: { y: 1470 } };
function segAt(t) { let s = TLD.segments[0]; for (const x of TLD.segments) if (t >= x.start - 1e-6) s = x; return s; }
function captions(t) {
  const sg = segAt(t), cfg = CAP[sg.id]; if (!cfg) return;
  const c = TLD.captions.find(c => t >= c.start && t < c.end); if (!c) return;
  const size = cfg.size || 84, maxW = cfg.maxW || 920, cx = cfg.x || W / 2; font(800, size);
  const sp = ctx.measureText(" ").width, ws = c.words.map(w => ({ ...w, wd: ctx.measureText(w.w).width })), lines = [[]]; let lw = 0;
  for (const w of ws) { if (lw && lw + sp + w.wd > maxW) { lines.push([]); lw = 0; } lines[lines.length - 1].push(w); lw += (lw ? sp : 0) + w.wd; }
  const lh = size * 1.12, y0 = cfg.y - (lines.length - 1) * lh / 2;
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, w, i) => a + w.wd + (i ? sp : 0), 0); let x = cx - tw / 2;
    for (const w of ln) {
      const u = P(t, w.t - 0.02, w.t + 0.12); if (u > 0) {
        const k = back(u); ctx.save(); ctx.translate(x + w.wd / 2, y0 + li * lh + (1 - eOut(u)) * 18); ctx.scale(lerp(0.82, 1, k), lerp(0.82, 1, k));
        txt(w.w, 0, 0, { size, color: w.e ? COP : "#fff", alpha: cl(u * 2.5), shadow: 0.85, stroke: 12 }); ctx.restore();
      }
      x += w.wd + sp;
    }
  });
}

// ---------- scenes ----------
function sCrash(id, t) { // the deployment crashes: red toast + red edge pulse on the punch-in
  const u = t - S(id), hit = 0.30; if (u < hit) return;
  vignette("rgba(229,72,77,A)", 0.55 * Math.exp(-(u - hit) * 3.2) + 0.12); toast("Deployment failed", u - hit, 300);
}
function sBlack(t) { // He had no idea what was coming.
  const u = t - S("co2"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const l1 = ["He", "had", "no", "idea"], l2 = ["what", "was", "coming."];
  const row = (ws, y, t0, color) => { font(400, 104, "ISI"); const sp = ctx.measureText(" ").width; const tw = ws.reduce((a, w) => a + ctx.measureText(w).width, 0) + sp * (ws.length - 1); let x = W / 2 - tw / 2;
    ws.forEach((w, i) => { const v = eOut(P(u, t0 + i * 0.07, t0 + i * 0.07 + 0.32)); const wd = ctx.measureText(w).width;
      txt(w, x + wd / 2, y + (1 - v) * 22, { size: 104, weight: 400, fam: "ISI", color, alpha: v }); font(400, 104, "ISI"); x += wd + sp; }); };
  row(l1, 880, 0.12, "#fff"); row(l2, 1010, 0.45, COP);
}
function sFreeze(t) { // the record-scratch freeze
  const u = t - S("frz");
  for (let y = 0; y < H; y += 6) { ctx.fillStyle = "rgba(0,0,0,.07)"; ctx.fillRect(0, y, W, 2); }
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = "#fff"; rr(70, 120, 22, 70, 6); ctx.fill(); rr(108, 120, 22, 70, 6); ctx.fill(); ctx.restore();
  txt("PAUSED", 220, 156, { size: 34, weight: 700, color: "rgba(255,255,255,.85)", align: "left" });
  const a = eOut(P(u, 0.12, 0.45)), b = eOut(P(u, 0.5, 0.8));
  txt("The demo worked.", W / 2, 760 + (1 - a) * 24, { size: 104, weight: 400, fam: "ISI", alpha: a, shadow: 0.8 });
  txt("Deployment didn't.", W / 2, 880 + (1 - b) * 24, { size: 92, weight: 800, color: COP, alpha: b, shadow: 0.8, stroke: 10 });
}
function sECG(t) { // "nobody plans to build software that dies": a heartbeat that flatlines on "dies"
  const t0 = S("t1b") + 0.05, td = T1(4.40), t1 = E("t1b"); if (t < t0 || t > t1) return;
  const x0 = 60, x1 = 1020, xd = 790, speed = (xd - x0) / (td - t0), head = Math.min(x1, x0 + (t - t0) * speed), y = 1200;
  const a = P(t, t0, t0 + 0.25) * (1 - P(t, t1 - 0.3, t1));
  const sig = x => { if (x > xd) return 0; const p = ((x - x0) % 230) / 230; return p > 0.55 && p < 0.62 ? -150 * Math.sin((p - 0.55) / 0.07 * Math.PI) : p > 0.62 && p < 0.67 ? 60 * Math.sin((p - 0.62) / 0.05 * Math.PI) : p > 0.4 && p < 0.48 ? -14 * Math.sin((p - 0.4) / 0.08 * Math.PI) : 0; };
  ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = 7; ctx.lineJoin = ctx.lineCap = "round"; ctx.shadowBlur = 18;
  for (const [from, to, col] of [[x0, Math.min(head, xd), GREEN], [xd, head, RED]]) { if (to <= from) continue;
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.beginPath(); for (let x = from; x <= to; x += 3) { const yy = y + sig(x); x === from ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); } ctx.stroke(); }
  ctx.beginPath(); ctx.arc(head, y + sig(head), 11, 0, 7); ctx.fillStyle = head > xd ? RED : GREEN; ctx.fill(); ctx.restore();
}
function demoPanel(t, g) { // top half of the split: the demo, where everything works (drawn into context g)
  const u = t - S("t1c"), e = eOut(P(u, 0, 0.4)); const bg = g.createLinearGradient(0, 0, 0, 960); bg.addColorStop(0, "#FBF7F1"); bg.addColorStop(1, "#EFE6DA");
  g.fillStyle = bg; g.fillRect(0, 0, W, 960);
  const au = g.createRadialGradient(860, 180, 20, 860, 180, 520); au.addColorStop(0, "rgba(229,156,105,.38)"); au.addColorStop(1, "rgba(229,156,105,0)"); g.fillStyle = au; g.fillRect(0, 0, W, 960);
  g.save(); g.translate(0, (1 - e) * 140); g.globalAlpha = e;
  g.shadowColor = "rgba(60,40,20,.18)"; g.shadowBlur = 50; g.shadowOffsetY = 18; g.beginPath(); g.roundRect(90, 150, 900, 720, 44); g.fillStyle = "#fff"; g.fill(); g.shadowColor = "transparent";
  g.font = "700 30px P"; g.textBaseline = "middle"; g.beginPath(); g.roundRect(140, 200, 220, 60, 30); g.fillStyle = "rgba(61,220,151,.16)"; g.fill();
  g.beginPath(); g.arc(172, 230, 9, 0, 7); g.fillStyle = "#19A86A"; g.fill(); g.fillStyle = "#19A86A"; g.textAlign = "left"; g.fillText("DEMO", 192, 231);
  g.fillStyle = "#9A9088"; g.font = "600 28px P"; g.textAlign = "right"; g.fillText("localhost:3000", 940, 231);
  g.fillStyle = INK; g.font = "800 62px P"; g.textAlign = "left"; g.fillText("Everything works.", 140, 330);
  const rows = [["Data", "clean", T1(6.90)], ["Users online", "1", T1(7.72)], ["Network", "perfect", T1(8.74)]];
  rows.forEach(([k, v, tt], i) => { const y = 470 + i * 140, ru = P(t, tt - 0.05, tt + 0.35);
    g.fillStyle = "#F4EFE8"; g.beginPath(); g.roundRect(140, y - 52, 800, 104, 26); g.fill();
    g.fillStyle = "#6E655D"; g.font = "600 36px P"; g.textAlign = "left"; g.fillText(k, 180, y + 2);
    g.globalAlpha = e * cl(ru * 3); g.fillStyle = INK; g.font = "800 42px P"; g.textAlign = "right"; g.fillText(v, 830, y + 2); g.globalAlpha = e;
    if (i === 1 && ru > 0) { g.fillStyle = COP; g.beginPath(); g.arc(500, y, 22 * back(cl(ru * 1.5)), 0, 7); g.fill(); }
    if (i === 2) { for (let b = 0; b < 4; b++) { g.fillStyle = ru > 0 ? INK : "#D8D0C6"; g.fillRect(470 + b * 22, y + 20 - (b + 1) * 11, 14, (b + 1) * 11); } }
    if (i === 0) { for (let r = 0; r < 3; r++) { g.fillStyle = ru > 0 ? "#CDE9DB" : "#E6DED4"; g.fillRect(440, y - 28 + r * 20, 120, 12); } }
    g.save(); const cx = 890, cy = y; if (ru > 0) { g.beginPath(); g.arc(cx, cy, 26 * back(cl(ru * 1.6)), 0, 7); g.fillStyle = "#19A86A"; g.fill();
      g.strokeStyle = "#fff"; g.lineWidth = 6; g.lineCap = g.lineJoin = "round"; g.beginPath(); g.moveTo(cx - 11, cy); g.lineTo(cx - 3, cy + 8); g.lineTo(cx + 12, cy - 8); g.stroke(); } g.restore();
  });
  g.restore();
}
const off = document.createElement("canvas"); off.width = W; off.height = 960; const og = off.getContext("2d");
function sSplit(t) {
  const u = t - S("t1c"), dur = SEG.t1c.dur; og.clearRect(0, 0, W, 960); demoPanel(t, og);
  const gl = P(u, dur - 0.30, dur); // the demo breaks right before the real world walks in
  if (gl <= 0) ctx.drawImage(off, 0, 0);
  else for (let k = 0; k < 24; k++) { const y = k * 40, dx = (hash(k + Math.floor(u * 30)) - 0.5) * 160 * gl; ctx.drawImage(off, 0, y, W, 40, dx, y, W, 40);
    if (hash(k * 3 + Math.floor(u * 30)) > 0.75) { ctx.fillStyle = `rgba(255,77,79,${0.35 * gl})`; ctx.fillRect(0, y, W, 40); } }
  ctx.fillStyle = COP; ctx.fillRect(0, 957, W, 6);
}
function sRealWorld(t) { // b-roll + REAL WORLD title
  const u = t - S("t2a"); const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(0,0,0,.55)"); g.addColorStop(0.45, "rgba(0,0,0,.15)"); g.addColorStop(1, "rgba(0,0,0,.6)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const a = eOut(P(u, 0, 0.28)), b = eOut(P(t, T2(1.40) - 0.05, T2(1.40) + 0.25)), c = eOut(P(t, T2(1.78) - 0.03, T2(1.78) + 0.22));
  chip("THE REAL WORLD", W / 2, 520, { bg: "rgba(255,77,79,.9)", dot: "#fff", size: 32, alpha: a });
  txt("THE REAL", W / 2 + (1 - a) * 160, 760, { size: 150, alpha: a, shadow: 0.7 });
  txt("WORLD", W / 2 + (1 - b) * 220, 920, { size: 230, color: COP, alpha: b, shadow: 0.7 });
  txt("walks in.", W / 2 + (1 - c) * 160, 1080, { size: 84, weight: 700, fam: "P", alpha: c, shadow: 0.8 });
}
function sPeople(t) { // hundreds of people
  const u = t - S("t2b"); ctx.fillStyle = "#0B0D12"; ctx.fillRect(0, 0, W, H);
  const n = Math.round(1 + 499 * eIn(P(u, 0.02, 0.9))), cols = 20, rows = 25, sx = 50, x0 = W / 2 - (cols - 1) * sx / 2, y0 = 470;
  const cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const x = x0 + c * sx, y = y0 + r * sx; cells.push([Math.hypot(x - W / 2, (y - 1070) * 0.8) + hash(r * 31 + c) * 60, x, y, r, c]); }
  cells.sort((a, b) => a[0] - b[0]);
  cells.slice(0, n).forEach(([d, x, y, r, c], i) => { const col = [COP, CREAM, "#8C94A3", "#5E6675"][Math.floor(hash(r * 7 + c * 13) * 4)];
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - 6, 8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(x, y + 12, 13, 9, 0, Math.PI, 0); ctx.fill(); });
  txt("USERS ONLINE", W / 2, 230, { size: 36, weight: 700, color: "#8C94A3" });
  txt(String(n), W / 2, 360, { size: 170, color: n > 1 ? COP : "#fff" });
}
const ROWS = [["Ravi Kumar", "98480 12345", "Hyderabad", "₹1,200", ""], ["ravi kumar.", "+91 9848012345", "HYD", "1200", "dup"],
  ["NULL", "—", "undefined", "NaN", "bad"], ["Priya S", "99999 99999", "Secundrabad", "₹ -0", "bad"], ["Arjun", "#ERROR", "Vizag", "₹1,2,00", "bad"],
  ["", "000", "  ", "null", "bad"], ["Sneha R", "90000 00000", "Hyderabad", "₹950", ""], ["SNEHA R", "9000000000", "hyderabad ", "950.00", "dup"],
  ["Kiran", "98xx", "N/A", "₹???", "bad"], ["Test User", "1234567890", "Test", "₹0", "bad"], ["Meena", "+91 9", "Warangal", "₹-120", "bad"], ["Ravi Kumar", "98480 12345", "Hyderabad", "₹1,200", "dup"]];
function sData(t) { // messy data
  const u = t - S("t2c"); ctx.fillStyle = "#0B0D12"; ctx.fillRect(0, 0, W, H);
  chip("MESSY DATA", W / 2, 250, { bg: "rgba(255,77,79,.18)", fg: RED, dot: RED, size: 34 });
  ctx.save(); rr(60, 340, 960, 1100, 36); ctx.fillStyle = "#14171E"; ctx.fill(); ctx.clip();
  const cols = [[100, "NAME"], [370, "PHONE"], [640, "CITY"], [860, "AMOUNT"]]; font(700, 26); ctx.textBaseline = "middle";
  ctx.fillStyle = "#1B1F28"; ctx.fillRect(60, 340, 960, 90); cols.forEach(([x, h]) => { ctx.fillStyle = "#8C94A3"; ctx.textAlign = "left"; ctx.fillText(h, x, 386); });
  const scroll = u * 380, rh = 96;
