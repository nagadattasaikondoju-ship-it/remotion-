<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>One Loop — The Thread</title>
<style>
  @font-face { font-family: "A"; src: url("fonts/Almarai-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "A"; src: url("fonts/Almarai-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "A"; src: url("fonts/Almarai-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: "IS"; src: url("fonts/InstrumentSerif-Italic.ttf"); font-style: italic; }
  @font-face { font-family: "IS"; src: url("fonts/InstrumentSerif-Regular.ttf"); font-style: normal; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="logo.js"></script>
<script>
/* One Loop — "The Thread That Closes the Gaps". 1080×1920, 76 s, 120 BPM (beat 0.5 s, bar 2 s, 38 bars).
   Every pixel is a pure function of t: window.seek(t) draws the frame; nothing animates on its own.
   One copper element carries the whole film: the full stop of the hook drips, becomes the thread that stitches four
   vendors into one loop, the logo, the audit lens, the CTA, the growth-path rail, the route around the globe and the
   3D ribbon, and it lands as the real traced logo on the end card. */
const W = 1080, H = 1920, CX = 540, CY = 960, DUR = 76, FITW = 980;
const COP = "#E59C69", TER = "#8F432E", CRM = "#E1E0CC", INK = "#161616", BLK = "#000000", WHT = "#FFFFFF";
const EDGE = "#2C2C2C", GRY = "#9CA3AF", DIM = "#6B7280";
const RGB = { cop: [229, 156, 105], ter: [143, 67, 46] };

/* ---------- time helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eIn = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eIO = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// critically damped spring: 0 → 1 after t0 (no overshoot, no bounce)
const spring = (t, t0, w = 18) => { const d = t - t0; return d <= 0 ? 0 : 1 - (1 + w * d) * Math.exp(-w * d); };

function mono(keys, t) { // Fritsch–Carlson monotone cubic through [t, v] keys: smooth, never overshoots
  const n = keys.length; if (t <= keys[0][0]) return keys[0][1]; if (t >= keys[n - 1][0]) return keys[n - 1][1];
  const dx = [], m = [], d = []; for (let i = 0; i < n - 1; i++) { dx.push(keys[i + 1][0] - keys[i][0]); d.push((keys[i + 1][1] - keys[i][1]) / dx[i]); }

  let i = 0; while (t > keys[i + 1][0]) i++; const h = dx[i], u = (t - keys[i][0]) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * keys[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * keys[i + 1][1] + (u3 - u2) * h * m[i + 1];

const rngf = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

/* ---------- polylines ---------- */

    const u = (s - c[j]) / (c[j + 1] - c[j] || 1); out.push([lerp(pts[j][0], pts[j + 1][0], u), lerp(pts[j][1], pts[j + 1][1], u)]); }

}

    const u0 = clamp((a - c[i]) / (c[i + 1] - c[i] || 1)), u1 = clamp((b - c[i]) / (c[i + 1] - c[i] || 1));

    const p1 = [lerp(pts[i][0], pts[i + 1][0], u1), lerp(pts[i][1], pts[i + 1][1], u1)];

/* ---------- the real One Loop mark (logo.js, traced) ----------

const RL = LOGO.meta.rl, SW = LOGO.meta.sw, TH = Math.asin(2 * RL);
const XL = 0.2076, XH = 0.0369, XLW = 0.0316;

  const p = [], seg = (a, b, m) => { for (let i = 0; i < m; i++) { const u = i / m; p.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); } };

  const sn = Math.sin(TH), cs = Math.cos(TH), T = [-0.5 * cs * cs, 0.5 * sn * cs], a0 = Math.PI / 2 - TH, span = Math.PI + 2 * TH;

}
const N = 480, FIG8 = resample(fig8Raw(), N), FIG8C = cum(FIG8);
const DL = 0.5 * Math.cos(TH), AL = (Math.PI + 2 * TH) * RL, TL = 4 * DL + 2 * AL;
const FR = [0, DL / TL, (DL + AL) / TL, (2 * DL + AL) / TL, (3 * DL + AL) / TL, (3 * DL + 2 * AL) / TL, 1];
const MARK_W = 1 + 2 * (RL + SW / 2);
function pathOf(ctx, polys, S) { ctx.beginPath(); for (const poly of polys) { poly.forEach(([x, y], i) => (i ? ctx.lineTo(x * S, y * S) : ctx.moveTo(x * S, y * S))); ctx.closePath(); } }
function drawLoops(ctx, S) { ctx.fillStyle = COP; for (const g of [LOGO.CL, LOGO.CR]) { pathOf(ctx, g, S); ctx.fill("evenodd"); } }
function drawXLogo(ctx, S, scale, rot) { if (scale <= 0.001) return; ctx.save(); ctx.rotate(rot); ctx.scale(scale, scale); pathOf(ctx, LOGO.X, S); ctx.fillStyle = COP; ctx.fill("evenodd"); ctx.restore(); }
function diagonals(ctx, S, r, lw) {
  if (r >= 1) return;

  ctx.strokeStyle = COP; ctx.lineWidth = lw; ctx.lineCap = "butt";
  strokePart(ctx, pts, cc, 0, FR[1] * (1 - r)); strokePart(ctx, pts, cc, FR[2] + (FR[3] - FR[2]) * r, FR[3]);
  strokePart(ctx, pts, cc, FR[3], FR[3] + (FR[4] - FR[3]) * (1 - r)); strokePart(ctx, pts, cc, FR[5] + (FR[6] - FR[5]) * r, 1);
}
// the snap that turns the continuous figure-eight into the logo: diagonals retract into the crossing, the X spins in
function markSnap(ctx, S, t, t0) { drawLoops(ctx, S); diagonals(ctx, S, eOut(P(t, t0, t0 + 0.3)), SW * S); const s = spring(t, t0, 16); drawXLogo(ctx, S, s, (Math.PI / 2) * (1 - s)); }
// full lockup (mark + wordmark + tagline) with the mark centred at (cx, cy); wp/tp = wordmark / tagline progress
function lockup(ctx, cx, cy, S, t, tw, tt, snapT) {
  const M = LOGO.meta;
  ctx.save(); ctx.translate(cx, cy); if (snapT === null) { drawLoops(ctx, S); drawXLogo(ctx, S, 1, 0); } else markSnap(ctx, S, t, snapT); ctx.restore();
  const wTop = cy + M.wordTop * S, wBot = cy + M.wordBot * S, wh = wBot - wTop;
  if (tw > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, wTop - 3, W, wh + 6); ctx.clip(); ctx.fillStyle = WHT;
    LOGO.WORD.forEach((L, i) => { const o = Math.abs(i - 3), up = (1 - eOut(clamp(tw * 1.6 - o * 0.12))) * wh * 1.15;
      if (up >= wh * 1.1) return; ctx.save(); ctx.translate(cx, cy + up); pathOf(ctx, L.paths, S); ctx.fill("evenodd"); ctx.restore(); });
    ctx.restore(); }
  if (tt > 0) { const half = ((M.right - M.left) / 2) * S + 20; ctx.save(); ctx.beginPath();
    ctx.rect(cx - half * tt, cy + M.tagTop * S - 6, 2 * half * tt, (M.tagBot - M.tagTop) * S + 12); ctx.clip();
    ctx.translate(cx, cy); pathOf(ctx, LOGO.TAGW, S); ctx.fillStyle = WHT; ctx.fill("evenodd"); pathOf(ctx, LOGO.TAGC, S); ctx.fillStyle = COP; ctx.fill(); ctx.restore(); }
}

/* ---------- type ---------- */
const fA = (w, s) => `${w} ${s}px A`, fS = (s) => `italic 400 ${s}px IS`;
function setFont(ctx, f, size, w = 800) { ctx.font = f === "S" ? fS(size) : fA(w, size); ctx.letterSpacing = f === "S" ? "0px" : `${(-0.025 * size).toFixed(2)}px`; }
// words → [{s, t, f}] with times t0, t0+step, …
const wl = (str, t0, step = 0.25, f = "A", c) => str.split(" ").map((s, i) => ({ s, t: t0 + i * step, f, c }));
/* headline: each word rises through its own mask on its own time, exits through it at o.out (staggered).
   lines: [[word…]…]; o: {x, y, size, lh, align, out, inDir, outDir, color, accent}. Lines auto-fit to FITW-60. */
function head(ctx, t, lines, o) {
  let size = o.size; const sp = () => size * 0.25, rects = [];
  const meas = (ln) => ln.map((w) => { const sz = w.f === "S" ? size * 1.16 : size; setFont(ctx, w.f, sz); return { ...w, sz, wd: ctx.measureText(w.s).width }; });
  let k = 1; for (const ln of lines) { const ws = meas(ln), tot = ws.reduce((a, w) => a + w.wd, 0) + sp() * (ws.length - 1); k = Math.min(k, (o.fit || FITW - 60) / tot); }
  size *= k; const lh = (o.lh || o.size * 1.06) * k;
  lines.forEach((ln, li) => {
    const ws = meas(ln), tot = ws.reduce((a, w) => a + w.wd, 0) + sp() * (ws.length - 1);
    let x = o.align === "left" ? o.x : o.x - tot / 2; const y = o.y + li * lh;
    ws.forEach((w, wi) => {
      let prog = eOut(P(t, w.t, w.t + 0.26));
      const to = o.out !== undefined ? o.out + 0.03 * (li * 3 + wi) : 1e9;
      if (t >= to) prog = 1 + eIn(P(t, to, to + 0.2));
      rects.push({ x, y, wd: w.wd, sz: w.sz, prog });
      if (prog > 0 && prog < 2) {
        ctx.save(); ctx.beginPath(); ctx.rect(x - 14, y - size * 1.02, w.wd + 28, size * 1.36); ctx.clip();
        const off = prog <= 1 ? (1 - prog) * size * 1.2 * (o.inDir || 1) : -(prog - 1) * size * 1.2 * (o.outDir || 1);
        setFont(ctx, w.f, w.sz); ctx.fillStyle = w.c || (w.f === "S" ? o.accent || COP : o.color || CRM); ctx.textBaseline = "alphabetic";

function mtext(ctx, s, x, y, size, prog, o = {}) {

  const off = prog <= 1 ? (1 - prog) * size * 1.2 : -(prog - 1) * size * 1.2;

}
const inout = (t, a, b, len = 0.24) => (t < b ? eOut(P(t, a, a + len)) : 1 + eIn(P(t, b, b + 0.2)));
function textW(ctx, s, size, f = "A", w = 800, track) { setFont(ctx, f, size, w); if (track !== undefined) ctx.letterSpacing = `${track * size}px`; return ctx.measureText(s).width; }

/* ---------- UI atoms ---------- */
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }

/* ---------- 3D (ribbon finale) ---------- */
const FOC = 1800, DIST = 1800;

    { k: "wo", pts: (i) => [corner(i, 1, -1), corner(i + 1, 1, -1), corner(i + 1, 1, 1), corner(i, 1, 1)], nrm: (i) => Nn[i], col: RGB.ter },
    { k: "wi", pts: (i) => [corner(i, -1, -1), corner(i + 1, -1, -1), corner(i + 1, -1, 1), corner(i, -1, 1)], nrm: (i) => [-Nn[i][0], -Nn[i][1], 0], col: RGB.ter },
