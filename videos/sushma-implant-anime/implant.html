<!doctype html>
<html><head><meta charset="utf-8">
<!-- Split-screen awareness reel, bottom half: an anime story of a missing tooth -> face change -> bone loss -> implant on time.
     1080x1920 canvas at 2x; the top 596 px stay black (the speaker video goes there). Pure function of t: seek(t).
     Every beat is timed to the speaker's words (Whisper turbo, word level). -->
<style>
@font-face { font-family: MB; font-weight: 900; src: url(fonts/Montserrat-Black.ttf); }
@font-face { font-family: Bangers; src: url(fonts/Bangers-Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
canvas { width: 1080px; height: 1920px; display: block; }
</style></head>
<body><canvas id="c" width="2160" height="3840"></canvas>
<script>
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1080, H = 1920, DPR = 2, INK = '#16182E';
</script>
<script src="lib.js"></script>
<script>
// ---------- the speaker's words (s) ----------
const tBreak = 2.3, tMissing = 4.3, tAsar = 5.3, tChehre = 8.5, tWaqt = 9.8, tAakar = 12.0, tHaddi = 14.4, tGhulne = 15.4,
  tFix = 17.9, tMushkil = 19.8, tImplant = 21.9, tKhali = 24.5, tSamay = 25.5, tBharna = 26.8, tZaroori = 27.3, tDeri = 29.4, tMehngi = 30.1, TEND = 31.5;
const SA = 0, SB = 7.55, SC = 13.65, SD = 21.7, SE = 29.3;           // scene starts
const PY = 596;                                                         // the panel starts under the speaker video

// ---------- helpers ----------
function panelClip() { X.beginPath(); X.rect(0, PY, W, H - PY); X.clip(); }
function flash(t, t0, d = .22, col = '255,255,255') { const k = 1 - seg(t, t0, t0 + d); if (t >= t0 && k > 0) { X.fillStyle = `rgba(${col},${k * .9})`; X.fillRect(0, PY, W, H - PY); } }
function crackLines(cx, cy, s, k) {   // zigzag cracks growing across a crown
  if (k <= 0) return; X.save(); X.strokeStyle = INK; X.lineWidth = 7 * s; X.lineCap = 'round'; X.lineJoin = 'round';
  const P = [[0, -320], [-18, -270], [14, -225], [-10, -180], [20, -130], [-6, -80]]; const n = Math.max(2, Math.ceil(P.length * k));
  X.beginPath(); P.slice(0, n).forEach(([x, y], i) => i ? X.lineTo(cx + x * s, cy + y * s) : X.moveTo(cx + x * s, cy + y * s)); X.stroke();
  if (k > .6) { X.beginPath(); X.moveTo(cx + 14 * s, cy - 225 * s); X.lineTo(cx + 60 * s, cy - 205 * s); X.lineTo(cx + 85 * s, cy - 230 * s); X.stroke(); }
  X.restore();
}
function gumBand(y0, gapX, gapW, col = '#F58FAA', shade = '#DE6E8E', socket = 0, band = 0) {
  // flat gum band with papillae between teeth and a dip where the tooth is missing
  X.beginPath(); X.moveTo(-50, y0);
  for (let x = -50; x <= 1130; x += 6) {
    const pap = Math.max(...[gapX - 350, gapX + 350].map(g => Math.exp(-Math.pow((x - (g < gapX ? gapX - 175 : gapX + 175)) / 46, 2))));
    const dip = gapW ? Math.exp(-Math.pow((x - gapX) / gapW, 2)) * 26 : 0;
    X.lineTo(x, y0 - pap * 60 + dip);
  }
  if (band) { for (let x = 1130; x >= -50; x -= 6) { const dip = gapW ? Math.exp(-Math.pow((x - gapX) / gapW, 2)) * 26 : 0; X.lineTo(x, y0 + band + dip * .6 + Math.sin(x * .03) * 4); } }
  else { X.lineTo(1130, H + 10); X.lineTo(-50, H + 10); }
  X.closePath();
  X.fillStyle = col; X.fill(); X.save(); X.clip(); X.fillStyle = shade; X.fillRect(-50, band ? y0 + band * .6 : y0 + 70, 1200, H); X.restore();
  X.lineWidth = 9; X.strokeStyle = INK; X.stroke();
  if (socket > 0) { X.save(); X.globalAlpha = socket; X.fillStyle = '#9C1B38'; X.beginPath(); X.ellipse(gapX, y0 + 30, 110, 26, 0, 0, 6.28); X.fill();
    X.lineWidth = 6; X.strokeStyle = INK; X.stroke(); X.fillStyle = '#C93A57'; X.beginPath(); X.ellipse(gapX - 20, y0 + 24, 60, 10, 0, 0, 6.28); X.fill(); X.restore(); }
}
function bone(y0, dip, t) {   // jawbone cross-section, cream with pores; `dip` lowers the crest under the gap (bone loss)
  const top = x => y0 + dip * Math.exp(-Math.pow((x - 540) / 175, 2));
  X.beginPath(); X.moveTo(-50, top(-50)); for (let x = -50; x <= 1130; x += 8) X.lineTo(x, top(x)); X.lineTo(1130, H + 10); X.lineTo(-50, H + 10); X.closePath();
  X.fillStyle = '#F3E2B8'; X.fill(); X.save(); X.clip();
  X.fillStyle = '#E2C98F'; X.fillRect(-50, y0 + 120, 1200, H);
  for (let i = 0; i < 140; i++) { const x = hash(i, 80) * 1080, y = y0 + 20 + hash(i, 81) * (H - y0), r = 6 + hash(i, 82) * 16;
    X.fillStyle = i % 3 ? 'rgba(176,130,60,.55)' : 'rgba(150,100,40,.45)'; X.beginPath(); X.ellipse(x, y, r, r * .7, hash(i, 83) * 3, 0, 6.28); X.fill(); }
  X.restore(); X.lineWidth = 8; X.strokeStyle = INK; X.stroke();
}
function screw(x, yTop, s, rot, glow) {   // titanium implant, threads scroll with rotation
  const w0 = 44 * s, w1 = 30 * s, h = 250 * s;
  X.save(); X.translate(x, yTop);
  if (glow > 0) { const g = X.createRadialGradient(0, h / 2, 10, 0, h / 2, 220 * s); g.addColorStop(0, `rgba(120,235,255,${.55 * glow})`); g.addColorStop(1, 'rgba(120,235,255,0)'); X.fillStyle = g; X.beginPath(); X.arc(0, h / 2, 220 * s, 0, 6.28); X.fill(); }
  X.beginPath(); X.moveTo(-w0, 0); X.lineTo(w0, 0); X.lineTo(w1, h - 24 * s); X.quadraticCurveTo(0, h + 10 * s, -w1, h - 24 * s); X.closePath();
  X.fillStyle = '#9AA8B8'; X.fill(); X.save(); X.clip(); X.fillStyle = '#D6DEE8'; X.fillRect(-w0, 0, w0 * .9, h + 20);
  X.strokeStyle = 'rgba(40,50,70,.75)'; X.lineWidth = 5 * s; const ph = (rot % 1) * 26 * s;
  for (let y = -26 * s + ph; y < h; y += 26 * s) { X.beginPath(); X.moveTo(-w0 - 4, y + 8 * s); X.lineTo(w0 + 4, y - 8 * s); X.stroke(); }
  X.restore(); X.lineWidth = 7 * s; X.strokeStyle = INK; X.stroke();
  X.restore();
}
function abutment(x, y, s) { X.save(); X.translate(x, y); X.beginPath(); X.moveTo(-40 * s, 0); X.lineTo(40 * s, 0); X.lineTo(28 * s, -70 * s); X.lineTo(-28 * s, -70 * s); X.closePath();
  X.fillStyle = '#C9D3DE'; X.fill(); X.lineWidth = 7 * s; X.strokeStyle = INK; X.stroke(); X.fillStyle = '#FFFFFF'; X.fillRect(-22 * s, -60 * s, 10 * s, 50 * s); X.restore(); }
function clock(x, y, r, t, rev) {
  X.save(); X.translate(x, y); X.fillStyle = '#FFFFFF'; X.beginPath(); X.arc(0, 0, r, 0, 6.28); X.fill(); X.lineWidth = 9; X.strokeStyle = INK; X.stroke();
  X.lineWidth = 4; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; X.beginPath(); X.moveTo(Math.cos(a) * r * .78, Math.sin(a) * r * .78); X.lineTo(Math.cos(a) * r * .9, Math.sin(a) * r * .9); X.stroke(); }
  const a1 = (rev ? -1 : 1) * t * 5.5, a2 = (rev ? -1 : 1) * t * .45; X.lineCap = 'round';
  X.lineWidth = 8; X.beginPath(); X.moveTo(0, 0); X.lineTo(Math.cos(a2 - 1.57) * r * .45, Math.sin(a2 - 1.57) * r * .45); X.stroke();
  X.lineWidth = 6; X.strokeStyle = '#E8262F'; X.beginPath(); X.moveTo(0, 0); X.lineTo(Math.cos(a1 - 1.57) * r * .72, Math.sin(a1 - 1.57) * r * .72); X.stroke();
  X.fillStyle = INK; X.beginPath(); X.arc(0, 0, 9, 0, 6.28); X.fill(); X.restore();
}
function bigX(x, y, s, k) { if (k <= 0) return; X.save(); X.translate(x, y); X.scale(back(k) * s, back(k) * s); X.lineCap = 'round';
  for (const [w, c] of [[44, INK], [30, '#FF2D4A']]) { X.lineWidth = w; X.strokeStyle = c; X.beginPath(); X.moveTo(-60, -60); X.lineTo(60, 60); X.moveTo(60, -60); X.lineTo(-60, 60); X.stroke(); } X.restore(); }
function impact(t, t0, col) {   // anime impact frames: 3 black/white frames then a colour frame
  const d = Math.round(t * 30) - Math.round(t0 * 30); if (d < 0 || d > 3) return;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0); const y = PY * DPR, h = (H - PY) * DPR;
  if (d < 3) { X.filter = `grayscale(1) contrast(${d === 1 ? 6 : 4})${d !== 1 ? ' invert(1)' : ''}`; X.drawImage(C, 0, y, C.width, h, 0, y, C.width, h); X.filter = 'none'; }
  else { X.globalCompositeOperation = 'multiply'; X.fillStyle = col; X.fillRect(0, y, C.width, h); }
  X.restore();
}

// ---------- scene A: the tooth breaks, the gap, neighbours drift ----------
function sceneA(t) {
  const G = 1600, z = 1 + .05 * seg(t, 0, SB);
  X.save(); X.translate(540, 1260); X.scale(z, z); X.translate(-540, -1260);
  const sh = shake(t, tBreak, .45, 16); X.translate(sh[0], sh[1]);
  sky(t, seg(t, tAsar, SB) * .35, 0);
  const tilt = eio(seg(t, tAsar, SB - .3)) * .12, worried = t > tMissing - .2;
  const exN = worried ? { eyes: t > tAsar + .6 ? 'shock' : 'normal', mouth: 'wavy', brows: 'worried', look: [0, .6] } : { eyes: 'happy', mouth: 'smile' };
  tooth(180, G, 1.05, exN, t + 1.3, { rot: tilt, arms: worried ? [2.5, 3.2, .6, -.1] : [1.9, 1.7, 1.2, 1.4] });
  tooth(900, G, 1.05, { ...exN, look: [0, .6] }, t + .4, { rot: -tilt, arms: worried ? [2.5, 3.2, .6, -.1] : [1.9, 1.7, 1.2, 1.4] });
  // the middle tooth: cracks, then pops out and flies away crying
  const fly = seg(t, tBreak, tBreak + .9);
  if (fly < 1) {
    const ex = t < 1.6 ? { eyes: 'happy', mouth: 'grin' } : t < tBreak ? { eyes: 'shock', mouth: 'shock', brows: 'worried' } : { eyes: 'panic', mouth: 'shock' };
    X.save(); X.globalAlpha = 1 - seg(fly, .7, 1);
    tooth(540 + fly * 420, G - fly * 900 + fly * fly * 250, 1.12, ex, t, { rot: fly * 2.4, arms: t > tBreak ? [3.4, 4.4, -.3, -1.3] : [1.9, 1.7, 1.2, 1.4] });
    X.restore(); if (fly === 0) crackLines(540, G, 1.12, seg(t, 1.75, tBreak));
    if (t > tBreak) for (let i = 0; i < 3; i++) { const k = ((t - tBreak) * 2.5 + i / 3) % 1; X.globalAlpha = 1 - k; drop(540 + fly * 420 + (i - 1) * 90 * k, G - fly * 900 + fly * fly * 250 - 260 + k * 140, 16, '#9FE3FF'); X.globalAlpha = 1; }
  }
  gumBand(G - 6, 540, t > tBreak ? 140 : 0, '#F58FAA', '#DE6E8E', seg(t, tBreak, tBreak + .25));
  if (t > tBreak && t < tBreak + .8) { const k = seg(t, tBreak, tBreak + .8); X.globalAlpha = 1 - k; X.fillStyle = '#FFFFFF';
    for (let j = 0; j < 6; j++) { X.beginPath(); X.arc(540 + (hash(j, 5) - .5) * 260 * (.4 + k), G - 40 - k * 120 - j * 14, 34 * (1 - k * .5), 0, 6.28); X.fill(); } X.globalAlpha = 1; }
  if (t > tAsar) { const a = seg(t, tAsar, tAsar + .4); X.globalAlpha = a * (.6 + .4 * Math.sin(t * 8)); txt('→', 360, 1300, 120, '#FFD24A', '#FFFFFF', 10); txt('←', 720, 1300, 120, '#FFD24A', '#FFFFFF', 10); X.globalAlpha = 1; }
  X.restore();
  stamp(t, tMissing - .05, 'MISSING TOOTH', 540, 760, 132, '#FF4F86', -.05);
}
// ---------- scene B: the whole face changes with time ----------
function faceShape(d) {   // front-view face outline; d = 0..1 how far the lower face has collapsed
  const cx = 540, cy = 1270;
  return [[cx - 250, cy - 150], [cx - 255, cy + 40], [cx - 230 + d * 20, cy + 190 - d * 30], [cx - 150 + d * 40, cy + 300 - d * 55],
    [cx, cy + 345 - d * 70], [cx + 150 - d * 40, cy + 300 - d * 55], [cx + 230 - d * 20, cy + 190 - d * 30], [cx + 255, cy + 40], [cx + 250, cy - 150]];
}
function facePath(P) { X.beginPath(); X.moveTo(540, 1270 - 330); X.bezierCurveTo(540 - 280, 1270 - 330, P[0][0] - 10, P[0][1] - 80, P[0][0], P[0][1]);
  for (let i = 1; i < P.length; i++) { const [x0, y0] = P[i - 1], [x1, y1] = P[i]; X.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2); }
  X.quadraticCurveTo(P[P.length - 1][0], P[P.length - 1][1], P[P.length - 1][0] + 2, P[P.length - 1][1] - 20);
  X.bezierCurveTo(P[8][0] + 10, P[8][1] - 80, 540 + 280, 1270 - 330, 540, 1270 - 330); X.closePath(); }
function sceneB(t) {
  const d = eio(seg(t, tWaqt + .2, 13.3)), z = 1 + .06 * seg(t, SB, SC);
  X.save(); X.translate(540, 1260); X.scale(z, z); X.translate(-540, -1260);
  const bg = X.createLinearGradient(0, PY, 0, H); bg.addColorStop(0, mix('#FFE4EC', '#D9D2F0', d)); bg.addColorStop(1, mix('#FFC2D4', '#A99BD8', d)); X.fillStyle = bg; X.fillRect(0, PY, W, H - PY);
  speedLines(t, 540, 1270, 470, 50, '#FFFFFF', .35);
  const P = faceShape(d), P0 = faceShape(0);
  // hair back
  X.fillStyle = '#23274D'; X.beginPath(); X.ellipse(540, 1130, 318, 300, 0, Math.PI, 0); X.lineTo(858, 1210); X.quadraticCurveTo(540, 1150, 222, 1210); X.closePath(); X.fill();
  facePath(P); X.fillStyle = '#FFDCC6'; X.fill(); X.save(); X.clip();
  X.fillStyle = '#F4BC9E'; X.beginPath(); X.ellipse(720, 1330, 120, 260, .2, 0, 6.28); X.fill();
  if (d > 0) { X.globalAlpha = d; X.fillStyle = 'rgba(160,90,90,.45)'; for (const s of [-1, 1]) { X.beginPath(); X.ellipse(540 + s * 165, 1395, 55, 95, -s * .3, 0, 6.28); X.fill(); } X.globalAlpha = 1; }
  X.restore(); facePath(P); X.lineWidth = 9; X.strokeStyle = INK; X.stroke();
  if (d > .02) { X.save(); X.setLineDash([16, 14]); X.lineWidth = 5; X.strokeStyle = `rgba(255,255,255,${.9 * Math.min(1, d * 3)})`; facePath(P0); X.stroke(); X.restore(); }
  // bangs
  X.fillStyle = '#23274D'; X.beginPath(); X.moveTo(250, 1150); for (let i = 0; i <= 8; i++) { const x = 250 + i * 72.5; X.lineTo(x, i % 2 ? 1010 + (i === 3 ? 60 : 0) : 1120); } X.lineTo(830, 1150); X.lineTo(830, 940); X.quadraticCurveTo(540, 830, 250, 940); X.closePath(); X.fill();
  X.lineWidth = 8; X.strokeStyle = INK; X.stroke();
  // eyes, brows, blush, mouth (droops as the face collapses)
  for (const s of [-1, 1]) eye(540 + s * 118, 1235, 1.55, d > .5 ? 'normal' : 'normal', 0, 0, .2, s);
  X.lineWidth = 8; X.strokeStyle = INK; X.lineCap = 'round';
  for (const s of [-1, 1]) { X.beginPath(); X.moveTo(540 + s * 75, 1150 - d * 12); X.lineTo(540 + s * 165, 1150 + d * 8); X.stroke(); }
  X.fillStyle = 'rgba(255,120,150,.5)'; for (const s of [-1, 1]) { X.beginPath(); X.ellipse(540 + s * 165, 1335, 50, 24, 0, 0, 6.28); X.fill(); }
  const my = 1440 - d * 50, cd = d * 34; X.lineWidth = 9; X.beginPath(); X.moveTo(480, my + cd); X.quadraticCurveTo(540, my + 26 - d * 40, 600, my + cd); X.stroke();
  if (d > .2) { X.globalAlpha = (d - .2) / .8; X.lineWidth = 5; X.strokeStyle = 'rgba(120,60,60,.8)'; for (const s of [-1, 1]) { X.beginPath(); X.moveTo(540 + s * 70, 1350); X.quadraticCurveTo(540 + s * 100, 1400, 540 + s * 88, 1450); X.stroke(); } X.globalAlpha = 1; }
  X.restore();
  if (t > tWaqt - .1) { const k = back(seg(t, tWaqt - .1, tWaqt + .2)); X.save(); X.translate(880, 760); X.scale(k, k); clock(0, 0, 95, t, false); X.restore(); }
  stamp(t, tChehre - .1, 'YOUR WHOLE FACE', 470, 760, 104, '#FFFFFF', -.05, tWaqt - tChehre - .15);
  stamp(t, tAakar - .05, 'FACE SHAPE CHANGES', 540, 1720, 104, '#FF4F86', -.04);
}
// ---------- scenes C + D: bone loss, a late fix fails, the implant done on time ----------
function sceneCD(t) {
  const late = t < SD, G = 1290;
  const dip = late ? eio(seg(t, tGhulne - .7, tGhulne + 1.1)) * 175 : 0;
  const z = late ? 1 + .05 * seg(t, SC, SD) : 1 + .04 * seg(t, SD, SE);
  X.save(); X.translate(540, 1300); X.scale(z, z); X.translate(-540, -1300);
  const sh = late ? shake(t, tMushkil, .4, 12) : shake(t, tBharna + .45, .3, 10); X.translate(sh[0], sh[1]);
  sky(t, late ? .25 + .35 * seg(t, tFix, tMushkil) : 0, late ? 0 : seg(t, SD, SD + .3) * (1 - seg(t, SD + 1.2, SD + 2.2)));
  bone(G + 40, dip, t);
  if (late && t > tGhulne - .8) for (let i = 0; i < 26; i++) { const k = ((t - tGhulne + .8) * .9 + hash(i, 90)) % 1; if (t > tGhulne + 2.5 && k < .3) continue;
    X.globalAlpha = (1 - k) * .9; X.fillStyle = '#E2C98F'; X.beginPath(); X.arc(380 + hash(i, 91) * 320, G + 60 + dip * .6 - k * 260, 7 + hash(i, 92) * 9, 0, 6.28); X.fill(); X.globalAlpha = 1; }
  // neighbours: lean into the gap while it stays empty, straighten when the new tooth lands
  const crownIn = late ? 0 : eio(seg(t, tBharna - .35, tBharna + .25));
  const tilt = late ? .12 + .04 * seg(t, tGhulne, tMushkil) : .12 * (1 - eio(seg(t, tBharna, tBharna + .7)));
  const cheer = !late && t > tBharna + .3;
  const exN = cheer ? { eyes: 'happy', mouth: 'grin' } : late ? { eyes: t > tMushkil - .2 ? 'shock' : 'normal', mouth: 'wavy', brows: 'worried', look: [0, .7] } : { eyes: 'sparkle', mouth: 'o', look: [0, .6] };
  const armsN = cheer ? [3.6, 4.4, -.5, -1.3] : [2.5, 3.2, .6, -.1];
  tooth(150, G, 1.0, exN, t + 1.1, { rot: tilt, arms: armsN }); tooth(930, G, 1.0, exN, t + .2, { rot: -tilt, arms: armsN });
  if (late) {   // a late fix: the implant cannot hold in the thinned bone
    const k = seg(t, tFix - .5, tFix + .4), out = seg(t, tMushkil - .05, tMushkil + .5);
    if (k > 0) { const y = lerp(PY - 300, G + 40 + dip * .55, eo(k)) - out * 520, wob = (t > tFix + .4 && out === 0) ? Math.sin(t * 26) * .22 * seg(t, tFix + .4, tFix + .8) : out * 1.6;
      X.save(); X.translate(540, y + 120); X.rotate(wob); X.translate(-540, -(y + 120)); X.globalAlpha = 1 - out * .8; screw(540, y, 1, 0, 0); X.restore(); }
    bigX(540, G - 120, 1.4, seg(t, tMushkil, tMushkil + .2));
  } else {     // on time: screw spins in, abutment clicks on, the crown lands
    const k = seg(t, tImplant + .5, tKhali), yS = lerp(PY - 280, G + 40, eo(seg(t, tImplant + .5, tImplant + 1.0))) + (G + 40 - (G + 40)) * k;
    if (t > tImplant + .4) screw(540, Math.min(yS, G + 40), 1, (t - tImplant) * 4 * (1 - seg(t, tKhali - .2, tKhali)), 1 - seg(t, tKhali, tKhali + .6));
    if (t > tImplant + 1.0 && t < tKhali + .2) for (let i = 0; i < 10; i++) { const kk = ((t * 3 + hash(i, 60)) % 1); X.fillStyle = `rgba(255,230,140,${1 - kk})`; star4(540 + (hash(i, 61) - .5) * 160, G + 40 - kk * 90, 14 * (1 - kk) + 4, `rgba(255,236,150,${1 - kk})`, kk * 3); }
    const ka = seg(t, tSamay - .2, tSamay + .15); if (ka > 0 && crownIn < 1) { X.save(); X.globalAlpha = 1; abutment(540, lerp(G - 140, G + 40, eo(ka)), 1); X.restore(); }
    if (crownIn > 0) { const exC = crownIn < 1 ? { eyes: 'happy', mouth: 'smile' } : { eyes: t > tZaroori + 1.2 ? 'wink' : 'sparkle', mouth: 'grin' };
      tooth(540, lerp(PY + 100, G, crownIn), 1.02, exC, t, { arms: crownIn >= 1 ? [3.6, 4.4, -.5, -1.3] : [1.9, 1.7, 1.2, 1.4] }); }
  }
  gumBand(G - 6, 540, (late || crownIn < 1) ? 140 : 0, late ? mix('#F58FAA', '#E04A64', seg(t, tGhulne, tMushkil)) : '#F58FAA', late ? '#C9506C' : '#DE6E8E', 0, 64);
  if (!late && t > tBharna + .2) sparkles(t, 540, 1050, 420, 260, 12, 31, '#FFFFFF', 34);
  if (late && t > tMushkil) { X.globalAlpha = seg(t, tMushkil, tMushkil + .3); txt('?!', 820, 900, 170, '#FF2D4A', '#FFFFFF', 12, 'Bangers', .12); X.globalAlpha = 1; }
  X.restore();
  if (late) { stamp(t, tHaddi - .05, 'BONE LOSS', 540, 760, 150, '#FF8A3D', -.05, tFix - tHaddi - .5); stamp(t, tMushkil - .05, 'HARDER TO FIX', 540, 760, 140, '#FF2D4A', -.04); }
  else {
    if (t < SD + 1.1) { const k = back(seg(t, SD, SD + .25)); X.save(); X.translate(540, 1000); X.scale(k * (1 + .2 * seg(t, SD + .7, SD + 1.1)), k * (1 + .2 * seg(t, SD + .7, SD + 1.1))); X.globalAlpha = 1 - seg(t, SD + .7, SD + 1.1); clock(0, 0, 120, (SD - t) * 9, true); X.restore(); }
    stamp(t, tImplant - .05, 'DENTAL IMPLANT', 540, 740, 140, '#FFD24A', -.04, tZaroori - tImplant - .2);
    stamp(t, tZaroori - .05, 'ON TIME!', 540, 750, 190, '#2FD27B', -.06);
  }
}
// ---------- scene E: delay costs more ----------
function sceneE(t) {
  const bg = X.createLinearGradient(0, PY, 0, H); bg.addColorStop(0, '#2A1650'); bg.addColorStop(1, '#8C2F6B'); X.fillStyle = bg; X.fillRect(0, PY, W, H - PY);
  speedLines(t, 540, 1300, 420, 70, '#FFFFFF', .25, 5);
  // calendar flipping
  const pages = Math.floor((t - SE) * 9); X.save(); X.translate(290, 1330); X.rotate(-.06);
  X.fillStyle = '#FFFFFF'; X.strokeStyle = INK; X.lineWidth = 8; X.beginPath(); X.roundRect(-170, -190, 340, 380, 22); X.fill(); X.stroke();
  X.fillStyle = '#E8262F'; X.beginPath(); X.roundRect(-170, -190, 340, 92, [22, 22, 0, 0]); X.fill(); X.stroke();
  X.fillStyle = '#FFFFFF'; X.font = '52px Bangers'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(['JAN', 'MAR', 'JUN', 'SEP', 'DEC', 'JAN', 'APR', 'AUG'][pages % 8], 0, -142);
  X.fillStyle = INK; X.font = '170px Bangers'; X.fillText(String(1 + (pages * 7) % 28), 0, 40);
  const fp = ((t - SE) * 9) % 1; X.save(); X.globalAlpha = 1 - fp; X.transform(1, 0, 0, 1 - fp, 0, -98 * fp); X.fillStyle = '#F4F4F8'; X.fillRect(-166, -98, 332, 284); X.restore();
  X.restore();
  // ₹ coin stack growing
  const n = 2 + Math.floor(seg(t, SE + .2, TEND - .1) * 9);
  for (let i = 0; i < n; i++) { const y = 1600 - i * 46; X.fillStyle = '#C8902A'; X.strokeStyle = INK; X.lineWidth = 6; X.beginPath(); X.ellipse(790, y + 14, 140, 34, 0, 0, 6.28); X.fill(); X.stroke();
    X.fillStyle = '#FFCF4A'; X.beginPath(); X.ellipse(790, y, 140, 34, 0, 0, 6.28); X.fill(); X.stroke(); X.fillStyle = '#B57A00'; X.font = '44px MB'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('₹', 790, y + 2); }
  if (t > tMehngi) for (let i = 0; i < 5; i++) { const k = ((t - tMehngi) * 1.4 + i / 5) % 1; X.globalAlpha = 1 - k; txt('₹', 700 + i * 50, 1100 - k * 260, 80, '#FFCF4A', '#FFFFFF', 8); X.globalAlpha = 1; }
  stamp(t, tDeri - .05, "DON'T DELAY!", 540, 760, 170, '#FF4F86', -.05);
  stamp(t, tMehngi - .05, 'DELAY COSTS MORE', 540, 905, 92, '#FFCF4A', .03);
}

function draw(t) {
  X.setTransform(DPR, 0, 0, DPR, 0, 0); X.clearRect(0, 0, W, H); X.fillStyle = '#000'; X.fillRect(0, 0, W, PY);
  X.save(); panelClip();
  if (t < SB) sceneA(t); else if (t < SC) sceneB(t); else if (t < SE) sceneCD(t); else sceneE(t);
  flash(t, SB, .25); flash(t, SC, .25); flash(t, SD, .3, '255,244,200'); flash(t, SE, .25);
  X.restore();
  // divider between the speaker and the story
  X.fillStyle = '#FFD24A'; X.fillRect(0, PY - 3, W, 7); X.fillStyle = INK; X.fillRect(0, PY + 4, W, 3);
  impact(t, tBreak, '#FF4F86'); impact(t, tImplant, '#FFD24A');
}
window.seek = t => draw(t); window.TIMING = { TEND, PY };
window.ready = (async () => { await Promise.all(['900 80px MB', '80px Bangers'].map(f => document.fonts.load(f))); await document.fonts.ready; draw(0); return true; })();
</script></body></html>
