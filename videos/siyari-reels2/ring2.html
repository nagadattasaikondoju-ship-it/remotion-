<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
// Siyari "Imagine it. Design it. Wear it." v2 -- rebuilt shot for shot on the clean reference recording (ref/r3b.mp4, 12.57 s):
//   0-2.27 macro: the diamond, then the crown, lift off the shank | 2.27-6.6 pull back: small exploded ring, three callouts, title
//   6.6-6.8 dip to black | 6.8-9.7 the ring leaning on a glossy die, camera orbit, line | dip | 9.7- the Siyari swan sting
// Same ring construction as the reference (square crown, four flat bar prongs with white-gold tips, crossed basket, slim shank with

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

window.TIMING = { TEND: T.END };
await document.fonts.load('500 40px Jost');
const BG = new THREE.Color('#174029');
const sc = new THREE.Scene(); sc.environment = ENV; sc.background = BG; sc.fog = new THREE.Fog(BG, 10, 30);
sc.add(new THREE.HemisphereLight(0xeaf2ec, 0x0b2014, .55));
const key = new THREE.SpotLight(0xfff3e4, 70, 0, .55, .8, 2); key.position.set(-3, 8, 6); sc.add(key);

const ROSE = METAL.rose.clone(); ROSE.roughness = .1; ROSE.envMapIntensity = 1.7;
const WHITE = METAL.white.clone(); WHITE.roughness = .22; WHITE.envMapIntensity = 2.8; WHITE.color = new THREE.Color(1, 1, 1);
const Rb = 1, TH = .1, BWd = .14, RO = Rb + TH / 2, s = .42;
const shankGeo = (() => { const p = [], r0 = Rb - TH / 2, r1 = Rb + TH / 2, cr = .035, N = 6; const arc = (cx, cy, a0, a1) => { for (let i = 0; i <= N; i++) { const a = a0 + (a1 - a0) * i / N; p.push(new THREE.Vector2(cx + Math.cos(a) * cr, cy + Math.sin(a) * cr)); } };
  arc(r1 - cr, -BWd / 2 + cr, -Math.PI / 2, 0); arc(r1 - cr, BWd / 2 - cr, 0, Math.PI / 2); arc(r0 + cr, BWd / 2 - cr, Math.PI / 2, Math.PI); arc(r0 + cr, -BWd / 2 + cr, Math.PI, Math.PI * 1.5); p.push(p[0].clone());
  const g = new THREE.LatheGeometry(p, 180); g.rotateX(Math.PI / 2); return g; })();
const bar = (a, b, w, d, mat) => { const len = a.distanceTo(b), m = new THREE.Mesh(new THREE.BoxGeometry(w, len, d), mat); m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); return m; };
function buildRing() {
  const ring = new THREE.Group(), shank = new THREE.Group(), head = new THREE.Group(), stone = new THREE.Group();
  shank.add(new THREE.Mesh(shankGeo, ROSE));
  // cathedral shoulders: on each side two flat arms rise from the shank and meet under the crown ('A' shape, as in the reference)
  const at = deg => new THREE.Vector3(Math.sin(deg * Math.PI / 180) * RO, Math.cos(deg * Math.PI / 180) * RO, 0);
  [-1, 1].forEach(sd => { const apex = new THREE.Vector3(sd * .3, RO + .26, 0);
    shank.add(bar(at(sd * 22), apex, .07, .09, ROSE), bar(at(sd * 50), apex, .07, .09, ROSE)); });
  // crown: square frame, four flat bar prongs with white-gold tips, two crossing basket arcs
  const fy = .43, half = s * .76;
  [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([x, z]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(x ? .045 : half * 2 + .045, .065, z ? .045 : half * 2 + .045), ROSE); m.position.set(x * half, fy, z * half); head.add(m); });
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([x, z]) => { const p = new THREE.Mesh(new THREE.BoxGeometry(.085, .3, .05), ROSE); p.position.set(x * half, fy + .1, z * half); p.rotation.y = Math.atan2(x, z); head.add(p);
    const tip = new THREE.Mesh(new RoundedBoxGeometry(.1, .085, .065, 3, .02), WHITE); tip.position.set(x * half * .97, fy + .27, z * half * .97); tip.rotation.y = Math.atan2(x, z); head.add(tip); });
  [0, Math.PI / 2].forEach(r => { const arc = new THREE.Mesh(new THREE.TorusGeometry(half * 1.0, .032, 10, 40, Math.PI), ROSE); arc.rotation.set(Math.PI, r, 0); arc.position.y = fy - .03; arc.scale.y = 1.15; head.add(arc); });
  const gem = new THREE.Mesh(gemGeo('round', 7, null, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0, vertexColors: true, envMap: GENV, envMapIntensity: 2.6 }));
  gem.scale.setScalar(s); stone.add(gem);

}
const ring = buildRing(); sc.add(ring);
const mirror = buildRing(); mirror.scale.y = -1; sc.add(mirror);
const FLOOR_Y = -RO;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshPhysicalMaterial({ color: '#16402a', roughness: .3, clearcoat: .7, transparent: true, opacity: .85 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; sc.add(floor);
// the die: glossy emerald lacquer, cream pips (front 5, top 1, side 3 -- like the reference's)
const die = new THREE.Group(), DS = 1.3;
die.add(new THREE.Mesh(new RoundedBoxGeometry(DS, DS, DS, 8, .2), new THREE.MeshPhysicalMaterial({ color: '#1d5a3a', roughness: .18, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 1.2 })));
const pipM = new THREE.MeshPhysicalMaterial({ color: '#EDDAC2', roughness: .3, clearcoat: .6 }), pipG = new THREE.SphereGeometry(.13, 20, 12);
const pip = (x, y, z, n) => { const m = new THREE.Mesh(pipG, pipM); m.position.set(x, y, z); m.scale.set(n.x ? .25 : 1, n.y ? .25 : 1, n.z ? .25 : 1); die.add(m); };
const o = DS / 2 + .002, q = DS * .26;
[[0, 0], [-q, -q], [q, q], [-q, q], [q, -q]].forEach(([a, b]) => pip(a, b, o, { z: 1 }));
pip(0, o, 0, { y: 1 });
[[0, 0], [-q, -q], [q, q]].forEach(([a, b]) => pip(o, a, b, { x: 1 }));
die.position.set(-.3, FLOOR_Y + DS / 2, .5); die.rotation.y = -.3; sc.add(die);
const mdie = die.clone(); mdie.scale.y = -1; mdie.position.set(-.3, FLOOR_Y - DS / 2, .5); sc.add(mdie);
function pose(t) {
  const P = { lift: 0, hlift: 0, ry: 0, rx: 0, rz: 0, px: 0, die: false, cam: null, look: null, fov: 30 };
  if (t < T.S2) { const k = eio(clamp((t - .25) / 1.9)); P.lift = 1.15 * k; P.hlift = .32 * eio(clamp((t - .7) / 1.5)); P.ry = .02;
    P.cam = new THREE.Vector3(0, RO + .38 + .5 * k, lerp(2.7, 3.6, eio(clamp(t / 2.27)))); P.look = new THREE.Vector3(0, RO + .5 + .55 * k, 0); P.fov = 34; }
  else if (t < T.S3) { const u = t - T.S2; P.lift = 1.15; P.hlift = .32; P.ry = .1 + .025 * u;
    P.cam = new THREE.Vector3(0, 1.3, lerp(15.5, 15.0, u / 4.3)); P.look = new THREE.Vector3(0, .95, 0); P.fov = 30; }
  else { const u = t - T.S3, k = eio(clamp(u / 2.9)); P.die = true;
    P.rx = -.1; P.ry = .3; P.rz = 0; P.px = .3; P.pz = -.45;         // ring standing just behind the die, leaning back slightly
    const a = lerp(1.15, .12, k), r = lerp(9.6, 8.4, k);
    P.cam = new THREE.Vector3(Math.sin(a) * r, 1.5, Math.cos(a) * r); P.look = new THREE.Vector3(0, .3, 0); P.fov = 30; }
  return P;
}
function apply(P) {
  for (const [r, sgn] of [[ring, 1], [mirror, -1]]) { const { head, stone } = r.userData;
    head.position.y = RO - .02 + P.hlift; stone.position.y = RO + .52 + P.lift + P.hlift * .7; stone.rotation.y = P.lift * 1.3;
    r.rotation.set(P.rx * sgn, P.ry, P.rz * sgn, 'YXZ'); r.position.set(P.px, 0, P.pz || 0);
    if (P.die) { r.position.y = sgn > 0 ? FLOOR_Y + RO * Math.cos(P.rx) + .02 : -(FLOOR_Y + RO * Math.cos(P.rx) + .02) + 2 * FLOOR_Y; }
    else r.position.y = sgn > 0 ? 0 : 2 * FLOOR_Y; }
  die.visible = mdie.visible = P.die; cam.fov = P.fov; cam.updateProjectionMatrix(); cam.position.copy(P.cam); cam.lookAt(P.look); cam.updateMatrixWorld();
}
function arrow(g, x0, y0, cx, cy, x1, y1, k) {
  k = Math.min(1, k); if (k <= 0) return; g.save(); g.strokeStyle = 'rgba(250,252,249,.85)'; g.lineWidth = 2; g.lineCap = 'round';
  const N = 40, pts = []; for (let i = 0; i <= N * k; i++) { const u = i / N; pts.push([(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * y1]); }
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  if (k > .98) { const [xa, ya] = pts[pts.length - 2], a = Math.atan2(y1 - ya, x1 - xa); g.beginPath(); g.moveTo(x1 - 14 * Math.cos(a - .45), y1 - 14 * Math.sin(a - .45)); g.lineTo(x1, y1); g.lineTo(x1 - 14 * Math.cos(a + .45), y1 - 14 * Math.sin(a + .45)); g.stroke(); }
  g.restore(); }
function typed(g, lines, x, y, align, t0, t) { if (t < t0) return; g.save(); g.font = '500 23px Jost'; g.letterSpacing = '2px'; g.fillStyle = INK; g.textAlign = 'left'; let idx = 0;
  lines.forEach((l, li) => { const w = g.measureText(l).width; let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    for (const ch of l) { const k = clamp((t - t0 - idx * .02) / .12); const cw = g.measureText(ch).width; if (k > 0) { g.globalAlpha = k; g.fillText(ch, cx, y + li * 31); } cx += cw; idx++; } }); g.restore(); }
function title(g, lines, y, t0, t, size = 46) { if (t < t0) return; g.save(); g.font = `500 ${size}px Jost`; g.letterSpacing = '3px'; g.fillStyle = INK; g.textAlign = 'left'; let idx = 0;
  g.shadowColor = 'rgba(0,12,5,.5)'; g.shadowBlur = 14;
  lines.forEach((l, li) => { const w = g.measureText(l).width; let cx = W / 2 - w / 2;
    for (const ch of l) { const k = clamp((t - t0 - idx * .03) / .15); const cw = g.measureText(ch).width; if (k > 0) { g.globalAlpha = k; g.fillText(ch, cx, y + li * size * 1.2); } cx += cw; idx++; } }); g.restore(); }
window.seek = t => {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.clearRect(0, 0, W, H);
  if (t >= T.LOGO) { renderSting(t - T.LOGO, LOCK_B, false, .5); const k = 1 - ss(T.LOGO, T.LOGO + .2, t); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); } return; }
  const P = pose(t); apply(P); renderer.setClearColor(BG, 1); renderer.render(sc, cam); ctx.drawImage(glc, 0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H * .45, H * .22, W / 2, H * .5, H * .8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,4,.62)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const { stone, head } = ring.userData, wp = o => project(cam, o.getWorldPosition(new THREE.Vector3()));
  if (t < T.S2) { const sp = wp(stone), a = Math.exp(-Math.pow((t - 1.95) / .12, 2)); star(ctx, sp[0] + 50, sp[1] - 70, 140, a, .2); }
  else if (t < T.S3) { const u = t - T.S2, sp = wp(stone), hp = wp(head), bp = project(cam, new THREE.Vector3(-RO, 0, 0).applyMatrix4(ring.matrixWorld));
    typed(ctx, ['CHOOSE THE DIAMOND', 'THAT MATCHES YOU'], sp[0], sp[1] - 120, 'center', .45, u); arrow(ctx, sp[0] - 150, sp[1] - 70, sp[0] - 170, sp[1] + 20, sp[0] - 60, sp[1] + 30, (u - .8) / .4);
    typed(ctx, ['PERSONALISE IT', 'WITH DETAILS THAT', 'MAKE IT YOURS'], hp[0] + 120, hp[1] - 40, 'left', 1.05, u); arrow(ctx, hp[0] + 200, hp[1] + 60, hp[0] + 200, hp[1] + 130, hp[0] + 70, hp[1] + 110, (u - 1.45) / .4);
    const sx = Math.max(bp[0] - 40, 330); typed(ctx, ['CHOOSE THE SETTING', 'THAT FEELS TRUE', 'TO YOUR STYLE'], sx, bp[1] - 150, 'right', 1.65, u); arrow(ctx, sx - 130, bp[1] - 50, sx - 145, bp[1] + 40, bp[0] - 25, bp[1] + 50, (u - 2.05) / .4);
    title(ctx, ['IMAGINE IT. DESIGN IT.', 'WEAR IT.'], 1530, 2.6, u);
    star(ctx, sp[0] + 20, sp[1] - 25, 90, Math.exp(-Math.pow((u - 3.3) / .1, 2)), .3); }
  else { title(ctx, ['YOUR DREAM JEWELLERY,', 'CRAFTED BY SIYARI'], 1520, T.S3 + .6, t, 44);
    const sp = wp(stone); star(ctx, sp[0] + 10, sp[1] - 25, 100, Math.exp(-Math.pow((t - T.S3 - 2.1) / .12, 2)), .5); }
  drawCorner();

  const dip = Math.max(ss(T.DIP1 - .25, T.DIP1, t) * (1 - ss(T.S3, T.S3 + .25, t)), ss(T.DIP2 - .05, T.DIP2 + .15, t));
  if (dip > 0) { ctx.fillStyle = `rgba(0,0,0,${dip})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = true;
