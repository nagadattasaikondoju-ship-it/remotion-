<!doctype html>
<html><head><meta charset="utf-8"><title>Siyari earring edit</title>
<style>
@font-face{font-family:Jost;src:url(fonts/Jost-var.ttf);font-weight:100 900}
@font-face{font-family:Montserrat;src:url(fonts/Montserrat-var.ttf);font-weight:100 900}

</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
// Siyari "The Earring Edit". Follows reference r1 (showroom of pedestals, camera glides product to product on the beat,
// a leader line + label types in, price on the plinth), cut to that reference's own music (30 s, 100 bpm: products change every 8 beats).
// Products and prices: siyari.com/products.json (lowest variant price = "From"), photos cut out by tools/cutout.py.
import { W, H, S, ctx, INK, clamp, lerp, ss, eio, eout, rng, loadImg, velvet, renderSting, drawCorner, star, vignette, LOCK_D } from './lib.js';
const T = { OPEN: 1.27, W: [1.27, 5.98, 10.78, 15.58, 20.38], LOGO: 25.18, END: 30.0 };
window.TIMING = { TEND: T.END };
const GOLD = '#D9B77C', CREAM = '#EDDAC2';
const P = [
  { img: 'e1_cascade_hoop', name: 'CELESTIAL CASCADE', price: 'From ₹23,393', glint: [[.3, .55], [.74, .4]] },
  { img: 'e2_three_stone', name: 'THREE STONE', price: 'From ₹21,554', glint: [[.27, .88], [.71, .12]] },
  { img: 'e3_pear_aquamarine', name: 'PEAR AQUAMARINE', price: 'From ₹30,811', glint: [[.13, .84], [.2, .1]] },
  { img: 'e4_heart_halo', name: 'HEART HALO', price: 'From ₹32,222', glint: [[.25, .78], [.8, .72]] },
  { img: 'e5_round_marquise', name: 'ROUND & MARQUISE', price: 'From ₹44,564', glint: [[.23, .45], [.83, .3]] },
];
for (const p of P) p.im = await loadImg(`img/${p.img}.png`);
await document.fonts.load('600 60px Jost'); await document.fonts.load('600 40px Cormorant'); await document.fonts.load('600 20px Montserrat');
const SP = 720;                                    // world distance between front pedestals
const camX = t => {                               // glide to the next product on each 8-beat downbeat, slow drift while holding
  let x = 0, cur = 0;
  for (let k = 1; k < T.W.length; k++) { x += SP * eio(clamp((t - T.W[k] + .05) / .9)); if (t >= T.W[k]) cur = k; }
  return x + 12 * (t - T.W[cur]) - 25;
};
// ---------- static layers, drawn once at 2x
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w * S; c.height = h * S; const g = c.getContext('2d'); g.scale(S, S); return [c, g]; };
const vel = velvet(512, '#1d4a31', 9, 9000);
const [WALL, wg] = mkc(2600, 1300);              // back wall with fluted pilasters, tiles horizontally
{ const gr = wg.createLinearGradient(0, 0, 0, 1300); gr.addColorStop(0, '#0b2117'); gr.addColorStop(.55, '#143425'); gr.addColorStop(1, '#0f2a1d'); wg.fillStyle = gr; wg.fillRect(0, 0, 2600, 1300);
  for (let x = 0; x < 2600; x += 325) { const g2 = wg.createLinearGradient(x, 0, x + 150, 0);
    g2.addColorStop(0, 'rgba(0,0,0,.35)'); g2.addColorStop(.25, 'rgba(120,190,150,.10)'); g2.addColorStop(.55, 'rgba(150,215,175,.16)'); g2.addColorStop(.85, 'rgba(0,0,0,.25)'); g2.addColorStop(1, 'rgba(0,0,0,.4)');
    wg.fillStyle = g2; wg.fillRect(x, 0, 150, 1300); } }
function podium(g, x, yTop, r, ry, yBot, dim) {     // velvet cylinder plinth
  g.save();
  const side = g.createLinearGradient(x - r, 0, x + r, 0);
  side.addColorStop(0, `rgba(6,22,14,1)`); side.addColorStop(.35, `rgba(${38 * dim | 0},${88 * dim | 0},${60 * dim | 0},1)`); side.addColorStop(.6, `rgba(${30 * dim | 0},${72 * dim | 0},${49 * dim | 0},1)`); side.addColorStop(1, 'rgba(5,18,11,1)');
  g.beginPath(); g.moveTo(x - r, yTop); g.lineTo(x - r, yBot); g.ellipse(x, yBot, r, ry, 0, Math.PI, 0, true); g.lineTo(x + r, yTop); g.closePath(); g.fillStyle = side; g.fill();
  g.globalAlpha = .18; g.fillStyle = g.createPattern(vel, 'repeat'); g.fill(); g.globalAlpha = 1;
  const top = g.createRadialGradient(x - r * .2, yTop - ry * .3, 4, x, yTop, r * 1.05);
  top.addColorStop(0, `rgba(${70 * dim | 0},${130 * dim | 0},${95 * dim | 0},1)`); top.addColorStop(1, `rgba(${24 * dim | 0},${60 * dim | 0},${40 * dim | 0},1)`);
  g.beginPath(); g.ellipse(x, yTop, r, ry, 0, 0, Math.PI * 2); g.fillStyle = top; g.fill();
  g.strokeStyle = `rgba(170,230,190,${.22 * dim})`; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x, yTop, r, ry, 0, Math.PI * .05, Math.PI * .95); g.stroke();
  g.restore();
}
function product(g, p, cx, baseY, maxW, maxH, blur, dim) {
  const im = p.im, s = Math.min(maxW / im.width, maxH / im.height), w = im.width * s, h = im.height * s, x = cx - w / 2, y = baseY - h;
  g.save(); const sh = g.createRadialGradient(cx, baseY + 4, 4, cx, baseY + 4, w * .55); sh.addColorStop(0, `rgba(0,10,4,${.55 * dim})`); sh.addColorStop(1, 'rgba(0,10,4,0)');
  g.fillStyle = sh; g.beginPath(); g.ellipse(cx, baseY + 4, w * .55, 26, 0, 0, Math.PI * 2); g.fill();
  if (blur > .4) g.filter = `blur(${blur}px) brightness(${dim})`; else if (dim < 1) g.filter = `brightness(${dim})`;
  g.drawImage(im, x, y, w, h); g.restore(); return { x, y, w, h };
}
function typed(g, txt, x, y, t0, t, rate = .028) {   // letters appear one by one
  let cx = x; for (let i = 0; i < txt.length; i++) { const k = clamp((t - t0 - i * rate) / .12); const ch = txt[i], w = g.measureText(ch).width; if (k > 0) { g.globalAlpha = k; g.fillText(ch, cx, y); } cx += w; }
  g.globalAlpha = 1;
}
function callout(g, p, top, t, tIn, tOut) {
  const o = 1 - ss(tOut - .25, tOut, t); if (t < tIn || o <= 0) return;
  const lx = 540, dotY = top - 34, boxL = 150, boxB = 700;
  g.save(); g.globalAlpha = o;
  const k1 = eout((t - tIn) / .35), k2 = eout((t - tIn - .25) / .4);
  g.strokeStyle = CREAM; g.lineWidth = 2.5; g.beginPath(); g.arc(lx, dotY, 10 * k1, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 2; g.beginPath(); g.moveTo(lx, dotY - 10); g.lineTo(lx, lerp(dotY - 10, boxB, k1)); g.stroke();
  g.setLineDash([6, 6]); g.globalAlpha = o * .7; g.beginPath(); g.moveTo(lx, boxB); g.lineTo(lerp(lx, boxL, k2), boxB); g.moveTo(boxL, boxB); g.lineTo(boxL, lerp(boxB, 360, k2 * (k2 > .02))); g.stroke(); g.setLineDash([]);
  g.globalAlpha = o; const t2 = tIn + .45;
  if (t > t2) { const pw = (g.font = '600 21px Montserrat', g.letterSpacing = '2.5px', g.measureText(p.name).width + 34), kp = eout((t - t2) / .3);
    g.fillStyle = CREAM; g.beginPath(); g.roundRect(boxL + 22, 392, pw * kp, 42, 4); g.fill();
    g.fillStyle = '#16301f'; g.save(); g.beginPath(); g.rect(boxL + 22, 392, pw * kp, 42); g.clip(); g.fillText(p.name, boxL + 39, 421); g.restore(); }
  g.letterSpacing = '1px'; g.font = '600 70px Jost'; g.fillStyle = GOLD; typed(g, 'DIAMOND', boxL + 20, 512, t2 + .2, t);
  g.fillStyle = INK; typed(g, 'EARRINGS', boxL + 20, 584, t2 + .42, t);
  g.font = '400 27px Jost'; g.letterSpacing = '.5px'; g.fillStyle = 'rgba(250,252,249,.78)'; typed(g, 'Lab-grown  ·  IGI certified', boxL + 22, 640, t2 + .7, t, .018);
  g.restore();
}
function stage(t, lightK) {
  const cx = camX(t);
  ctx.drawImage(WALL, 0, 0, 2600 * S, 1300 * S, -((cx * .35) % 2600) - 600, 0, 2600, 1300);
  ctx.drawImage(WALL, 0, 0, 2600 * S, 1300 * S, -((cx * .35) % 2600) + 2000, 0, 2600, 1300);
  const fl = ctx.createLinearGradient(0, 1180, 0, H); fl.addColorStop(0, '#12301f'); fl.addColorStop(.3, '#0b2015'); fl.addColorStop(1, '#06140c'); ctx.fillStyle = fl; ctx.fillRect(0, 1180, W, H - 1180);
  const pool = ctx.createRadialGradient(540, 820, 40, 540, 900, 900); pool.addColorStop(0, `rgba(150,220,175,${.17 * lightK})`); pool.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H);
  // back row: smaller plinths between the front ones, products soft-focused
  for (let k = -2; k < 7; k++) { const x = (k * SP + SP / 2 - cx) * .8 + 540; if (x < -300 || x > W + 300) continue;
    podium(ctx, x, 1085, 165, 30, 1320, .62); product(ctx, P[((k % 5) + 7) % 5], x, 1088, 260, 250, 9, .55); }
  // front row
  let focus = null;
  for (let k = -1; k < 6; k++) { const x = k * SP - cx + 540; if (x < -400 || x > W + 400) continue;
    podium(ctx, x, 1268, 245, 46, 1640, 1);
    // reflection of the plinth on the floor
    if (k >= 0 && k < 5) { const p = P[k], blur = Math.min(12, Math.abs(x - 540) / 45);
      const r = product(ctx, p, x, 1270, 560, 520, blur, 1);
      if (Math.abs(x - 540) < 40) focus = { k, r, x };
      ctx.save(); ctx.font = '500 34px Jost'; ctx.letterSpacing = '1px'; ctx.textAlign = 'center'; ctx.fillStyle = `rgba(250,252,249,${.9 * (1 - Math.min(1, Math.abs(x - 540) / 200))})`; ctx.fillText(p.price, x, 1395); ctx.restore(); }
  }
  ctx.fillStyle = 'rgba(0,8,3,.0)';
  return focus;
}
window.seek = t => {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.clearRect(0, 0, W, H);
  if (t >= T.LOGO) { renderSting(t - T.LOGO, LOCK_D, true, .6); return; }        // crown lands on the beat at 25.78 s
  if (t < T.OPEN) {                                                                // opener: the dark stage, title on the intro hit
    stage(T.OPEN, .4); ctx.fillStyle = 'rgba(4,14,8,.72)'; ctx.fillRect(0, 0, W, H);
    const k = eout(t / .5); ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = INK; ctx.globalAlpha = k;
    ctx.font = '500 92px Cormorant'; ctx.letterSpacing = '8px'; ctx.fillText('THE EARRING', W / 2 + 4, 900 + (1 - k) * 20); ctx.fillText('EDIT', W / 2 + 4, 1000 + (1 - k) * 20);
    ctx.font = '500 24px Montserrat'; ctx.letterSpacing = '6px'; ctx.globalAlpha = k * .8; ctx.fillText('LAB-GROWN DIAMOND EARRINGS', W / 2 + 3, 1080);
    ctx.restore(); drawCorner(); return; }
  const f = stage(t, 1); vignette(ctx, .5);
  for (let k = 0; k < 5; k++) { const tIn = T.W[k] + (k ? .95 : .15), tOut = k < 4 ? T.W[k + 1] + .1 : T.LOGO + .05;
    const x = k * SP - camX(t) + 540, p = P[k], im = p.im, s = Math.min(560 / im.width, 520 / im.height), top = 1270 - im.height * s;
    if (Math.abs(x - 540) < 60) callout(ctx, p, top, t, tIn, tOut);
    if (Math.abs(x - 540) < 45) p.glint.forEach(([gx, gy], i) => { const ph = ((t - tIn) / 1.6 + i * .5) % 1, a = Math.exp(-Math.pow((ph - .5) / .07, 2));
      star(ctx, x - im.width * s / 2 + gx * im.width * s, top + gy * im.height * s, 30 + 26 * a, a * .9, .3 + i); }); }
  drawCorner();
  ctx.save(); ctx.textAlign = 'center'; ctx.font = '400 26px Jost'; ctx.letterSpacing = '2px'; ctx.fillStyle = 'rgba(250,252,249,.62)'; ctx.fillText('siyari.com  ·  Somajiguda, Hyderabad', W / 2, 1700); ctx.restore();
};
window.ready = true;
</script></body></html>
